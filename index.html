<script>
const SUPABASE_URL="https://ejzipstmvofhjsqrzvfs.supabase.co";
const SUPABASE_KEY="sb_publishable_nNqB08asItxVhY0WAeGXKQ_fKGRC5va";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});
const el=id=>document.getElementById(id);

function showAuth(){
  document.getElementById("auth").classList.remove("hidden");
}

function hideAuth(){
  document.getElementById("auth").classList.add("hidden");
}

function message(t,c=""){
  document.getElementById("msg").innerHTML=
    t?`<div class="${c}">${t}</div>`:"";
}
async function login(){let r=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(r.error)return message(r.error.message,"err");hideAuth();boot()}
async function signup(){let n=document.getElementById("managerName").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("password").value;if(!n||!e||p.length<6)return message("Inserisci nome, email e password (minimo 6 caratteri).","err");let r=await db.auth.signUp({email:e,password:p,options:{data:{manager_name:n}}});if(r.error)return message(r.error.message,"err");message("Registrazione effettuata. Ora puoi accedere.","ok")}
async function boot(){

  let s=await db.auth.getSession();

  user=s.data.session?.user;

  if(!user)
    return;

  let r=await db
    .from("managers")
    .select("*")
    .eq("email",user.email)
    .maybeSingle();

  if(r.error)
    return message(
      r.error.message,
      "err"
    );

  me=r.data;

  if(!me){

    message(
      "Account non ancora associato al fantallenatore. Registrati con il nome assegnato.",
      "err"
    );

    return;

  }

  el("who").innerHTML=`

    <b>${me.team_name || me.name}</b>

    <div class="muted" style="font-size:12px">
      ${me.name}${me.is_admin?" · ADMIN":""}
    </div>

  `;

  el("authBtn").innerHTML=
    '<button class="secondary" onclick="logout()">Esci</button>';

  el("app").classList.remove("hidden");

  nav();

  home();

}
async function logout(){await db.auth.signOut();location.reload()}
function nav(){let a=[["home","Dashboard"],["players","Listone"],["roster","Rosa"],["lineup","Formazione"],["trades","Scambi"],["calendar","Calendario"],["standings","Classifica"]];if(me.is_admin)a.push(["admin","Admin"]);el("nav").innerHTML=a.map(x=>`<button onclick="${x[0]}()">${x[1]}</button>`).join("")}
async function home(){

let r=await db.from("fantasy_scores")
.select("final_score")
.eq("manager_id",me.id);

if(r.error)
return message(r.error.message,"err");

let c=await db.from("fantasy_coach_scores")
.select("final_score")
.eq("manager_id",me.id);

if(c.error)
return message(c.error.message,"err");

let playerTotal=(r.data||[])
.reduce((s,x)=>s+Number(x.final_score||0),0);

let coachTotal=(c.data||[])
.reduce((s,x)=>s+Number(x.final_score||0),0);

let tot=playerTotal+coachTotal;

let teamName=me.team_name || "Nome squadra non impostato";

el("content").innerHTML=`

<div class="grid">

<div class="card">

<h2>${teamName}</h2>

<p class="muted" style="margin-top:-10px">
Fantallenatore: ${me.name}
</p>

<b>Nome squadra:</b>

<form onsubmit="event.preventDefault(); saveTeamName();">

<input
id="teamNameInput"
type="text"
value="${teamName==="Nome squadra non impostato" ? "" : teamName}"
maxlength="30"
placeholder="Nome della squadra"
autocomplete="off"
>

<button
type="submit"
style="width:100%;margin:5px 0 0;min-height:46px">

Salva nome squadra

</button>

</form>

<p class="muted">
Il nome squadra comparirà nel calendario, nella classifica e negli scambi.
</p>

<p>${me.credits} crediti</p>

</div>

<div class="card">

<h2>Punti fantasy</h2>

<b style="font-size:28px">
${tot.toFixed(1)}
</b>

<p class="muted">
Giocatori: ${playerTotal.toFixed(1)}
<br>
Allenatore: ${coachTotal.toFixed(1)}
</p>

</div>

</div>

<div class="card">

<h2>Benvenuto</h2>

<p class="muted">
FantaBasket Orzi: listone, rose, formazioni,
scambi, punteggi e classifica.
</p>

</div>

`;

}


async function saveTeamName(){

  let input=el("teamNameInput");

  if(!input)
    return message(
      "Campo nome squadra non trovato.",
      "err"
    );

  let name=input.value.trim();

  if(!name)
    return message(
      "Inserisci un nome per la squadra.",
      "err"
    );

  if(name.length>30)
    return message(
      "Il nome può avere massimo 30 caratteri.",
      "err"
    );

  let r=await db
    .from("managers")
    .update({
      team_name:name
    })
    .eq("id",me.id);

  if(r.error){

    console.error(
      "Errore salvataggio nome squadra:",
      r.error
    );

    return message(
      "Errore nel salvataggio: "+r.error.message,
      "err"
    );

  }

  /*
    Ricarichiamo il profilo dal database.
    Così siamo sicuri che il nome sia realmente
    quello salvato.
  */

  let fresh=await db
    .from("managers")
    .select("*")
    .eq("id",me.id)
    .maybeSingle();

  if(fresh.error)
    return message(
      fresh.error.message,
      "err"
    );

  if(fresh.data)
    me=fresh.data;

  message(
    "Nome squadra aggiornato!",
    "ok"
  );

  setTimeout(()=>{
    home();
  },500);

}
async function players(){

  let r=await db.from("players")
    .select("id,name,position,is_foreign,real_teams(id,name,coach)")
    .order("name");

  if(r.error)
    return message(r.error.message,"err");

  let c=await db.from("real_teams")
    .select("id,name,coach")
    .not("coach","is",null)
    .order("name");

  if(c.error)
    return message(c.error.message,"err");

  window.pc=r.data||[];
  window.realTeams=c.data||[];

  el("content").innerHTML=`

    <div class="card">

      <h2>Listone · ${window.pc.length} giocatori</h2>

      <label>Cerca giocatore</label>

      <input
        id="q"
        placeholder="Nome giocatore..."
        oninput="filterPlayers()">

      <label>Ruolo</label>

      <select id="roleFilter" onclick="event.stopPropagation()">
        <option value="">Tutti i ruoli</option>
        <option value="G">Guardie</option>
        <option value="A">Ali</option>
        <option value="C">Centri</option>
      </select>

      <label>Squadra</label>

    <select id="teamFilter" onclick="event.stopPropagation()">

        <option value="">Tutte le squadre</option>

        ${window.realTeams.map(t=>`
          <option value="${t.id}">
            ${t.name}
          </option>
        `).join("")}

      </select>

      <label>Straniero</label>

    <select id="foreignFilter" onclick="event.stopPropagation()">
        <option value="">Tutti</option>
        <option value="yes">Stranieri</option>
        <option value="no">Italiani</option>
      </select>

      <div id="pt"></div>

    </div>


    <div class="card">

      <h2>🧑‍🏫 Allenatori</h2>

      <table>

        <tr>
          <th>Allenatore</th>
          <th>Squadra</th>
        </tr>

        ${window.realTeams.map(x=>`

          <tr>
            <td>${x.coach||"Da definire"}</td>
            <td>${x.name||""}</td>
          </tr>

        `).join("")}

      </table>

    </div>

  `;

  renderPlayers(window.pc);

  el("q").addEventListener("input", filterPlayers);
  el("roleFilter").addEventListener("change", filterPlayers);
  el("teamFilter").addEventListener("change", filterPlayers);
  el("foreignFilter").addEventListener("change", filterPlayers);

}

function renderPlayers(a){

  el("pt").innerHTML=`

    <p class="muted">
      ${a.length} giocatori trovati
    </p>

    <table>

      <tr>
        <th>Giocatore</th>
        <th>Ruolo</th>
        <th>Squadra</th>
        <th>Str.</th>
      </tr>

      ${a.map(p=>`

        <tr>

          <td>${p.name}</td>

          <td>
            ${p.position||"Da definire"}
          </td>

          <td>
            ${p.real_teams?.name||"Da definire"}
          </td>

          <td>
            ${p.is_foreign?"Sì":""}
          </td>

        </tr>

      `).join("")}

    </table>

  `;

}


function filterPlayers(){

  let q=(el("q")?.value||"").toLowerCase().trim();

  let role=el("roleFilter")?.value||"";

  let team=el("teamFilter")?.value||"";

  let foreign=el("foreignFilter")?.value||"";

  let filtered=window.pc.filter(p=>{

    let name=(p.name||"").toLowerCase();

    let teamName=(p.real_teams?.name||"").toLowerCase();

    if(q && !name.includes(q) && !teamName.includes(q))
      return false;

    if(role && p.position!==role)
      return false;

    if(team && String(p.real_teams?.id)!==String(team))
      return false;

    if(foreign==="yes" && !p.is_foreign)
      return false;

    if(foreign==="no" && p.is_foreign)
      return false;

    return true;

  });

  renderPlayers(filtered);

}

async function lineup(){

  /* =========================
     GIORNATE
  ========================= */

  let m=await db
    .from("matchdays")
    .select("id,number,lineup_deadline,status")
    .order("number");

  if(m.error)
    return message(m.error.message,"err");

  let days=m.data||[];


  /* =========================
     ROSA DEL FANTALLENATORE
  ========================= */

let r=await db.from("rosters")
  .select(`
    player_id,
    players(
      name,
      position,
      real_team_id,
      real_teams(
        name
      )
    )
  `)
  .eq("manager_id",me.id)
  .eq("active",true);

  if(r.error)
    return message(r.error.message,"err");

  console.log("ROSA + SQUADRE:", r.data);

  /* =========================
     TROVA GIORNATA CORRENTE
  ========================= */

  let matches=await db
    .from("league_matches")
    .select("matchday_number,completed");

  if(matches.error)
    return message(matches.error.message,"err");

  let grouped={};

  (matches.data||[]).forEach(x=>{

    if(!grouped[x.matchday_number])
      grouped[x.matchday_number]=[];

    grouped[x.matchday_number].push(x);

  });


  let currentDay=null;

  for(let day of days){

    let number=day.number;

    let dayMatches=grouped[number]||[];

    let completed=
      dayMatches.length===4 &&
      dayMatches.every(x=>x.completed===true);

    if(!completed){

      currentDay=number;
      break;

    }

  }


  /* =========================
     GIORNATE DISPONIBILI
  ========================= */

  let currentIndex=
    days.findIndex(x=>x.number===currentDay);

  let availableDays=
    currentIndex>=0
      ? days.slice(0,currentIndex+1)
      : [];


  window.lineupDeadlines={};

  availableDays.forEach(x=>{

    window.lineupDeadlines[x.number]=
      x.lineup_deadline;

  });

  window.currentLineupDay=currentDay;


  /* =========================
     NOME SQUADRA FANTASY
  ========================= */

  let fantasyTeamName=
    me.team_name || me.name;


  /* =========================
     SCHERMATA
  ========================= */

  el("content").innerHTML=`

    <div class="card">

      <h2>${fantasyTeamName}</h2>

      <p class="muted" style="margin-top:-10px">
        Fantallenatore: ${me.name}
      </p>


      <h3>Formazione</h3>


    <select id="day"
  onchange="loadSavedLineup(); loadPlayerGames()">

  ${availableDays.map(x=>`

    <option
      value="${x.id}"
      data-number="${x.number}"
      ${x.number===currentDay?"selected":""}>

      Giornata ${x.number}
      ${x.number===currentDay?" · ATTUALE":""}

    </option>

  `).join("")}

</select>


      <div id="deadlineBox" class="card">

        <b>Deadline formazione:</b>

        <span id="deadlineText">—</span>

        <div
          id="countdown"
          style="font-size:22px;margin-top:8px">
        </div>

      </div>

<img
  src="https://upload.wikimedia.org/wikipedia/commons/5/51/Fortitudo_Agrigento.png"
  style="width:40px;height:40px;object-fit:contain;"
>

        <h3 style="margin-top:0">
          🏀 Formazione attuale
        </h3>

        <div class="muted">
          Completa la formazione per visualizzare il modulo.
        </div>

      </div>

      <div id="lp">

        ${(r.data||[]).map(x=>`

          <div class="card">

            <b>${x.players.name}</b>
            · ${x.players.position}

<div
  class="muted"
  style="margin-top:4px;font-size:13px"
  data-real-team="${x.players.real_team_id}">

  🏀
${x.players.real_teams?.name || "Squadra non disponibile"}

</div>

<div
  class="muted"
  style="margin-top:4px;font-size:13px"
  data-game-player="${x.player_id}">

  Caricamento avversaria...

</div>


<select
  data-p="${x.player_id}"
  data-pos="${x.players.position}"
  onchange="handleLineupRoleChange(this)">

              <option value="out">
                Fuori
              </option>

              <option value="starter">
                Titolare · 100%
              </option>

              <option value="sixth">
                Sesto uomo · 100%
              </option>

              <option value="bench">
                Panchina · 50%
              </option>

            </select>


            <label>

              <input
                type="checkbox"
                data-captain="${x.player_id}"
onchange="checkCaptain(this); updateLineupSummary()">

              Capitano

            </label>

          </div>

        `).join("")}

      </div>


      <div id="lineupStatus"
           class="muted">
      </div>


      <button
        id="saveLineupBtn"
        onclick="saveLineup()">

        Salva formazione

      </button>

<p class="muted">
  5 titolari (100%): 2G-2A-1C · 1G-3A-1C · 1G-2A-2C · 2G-1A-2C · 3G-1A-1C
  · 1 sesto uomo (100%)
  · 4 panchinari (50%)
  · 3 fuori (0%)
  · 1 capitano (×1,5)
</p>

    </div>

  `;


  /* =========================
     CARICA FORMAZIONE
  ========================= */

await loadSavedLineup();

updateLineupSummary();

setTimeout(()=>{
  loadPlayerGames();
},100);

}
async function loadPlayerGames(){

console.log("LOAD PLAYER GAMES PARTITA!");
  
  let select=el("day");

  if(!select)
    return;

console.log("SELECT DAY:", select);
console.log("NUMERO OPZIONI:", select.options.length);
console.log("INDICE SELEZIONATO:", select.selectedIndex);

let selected=select.options[select.selectedIndex];

console.log("OPZIONE SELEZIONATA:", selected);

if(!selected)
  return;

let matchdayId=selected.value;

console.log("MATCHDAY ID:", matchdayId);
  
  if(!matchdayId)
    return;

  let games=await db
    .from("real_games")
    .select(`
      home_team_id,
      away_team_id,
      scheduled_at,
      postponed,
      cancelled,
      home:home_team_id(name),
      away:away_team_id(name)
    `)
    .eq("matchday_id",matchdayId);

console.log("PARTITE GIORNATA:", games.data);
  
  if(games.error)
    return message(games.error.message,"err");
  
  let gamesByTeam={};

  (games.data||[]).forEach(game=>{

    gamesByTeam[game.home_team_id]={
      opponent:game.away?.name || "—",
      home:true,
      scheduled_at:game.scheduled_at,
      postponed:game.postponed,
      cancelled:game.cancelled
    };

    gamesByTeam[game.away_team_id]={
      opponent:game.home?.name || "—",
      home:false,
      scheduled_at:game.scheduled_at,
      postponed:game.postponed,
      cancelled:game.cancelled
    };

  });

  document
    .querySelectorAll("[data-game-player]")
    .forEach(box=>{

      let playerId=box.dataset.gamePlayer;

      let playerCard=
        document.querySelector(
          `select[data-p="${playerId}"]`
        )?.closest(".card");

      if(!playerCard)
        return;

      let teamElement=
        playerCard.querySelector(
          "[data-real-team]"
        );

      if(!teamElement)
        return;

      let teamId=
        teamElement.dataset.realTeam;

      let game=
        gamesByTeam[teamId];

      if(!game){

/*

function updateLineupDeadline(){

  let select=el("day");

  if(!select)
    return;

  let selected=select.options[select.selectedIndex];

  if(!selected)
    return;

  let matchdayNumber=
    Number(selected.dataset.number);

  let deadlineString=
    window.lineupDeadlines?.[matchdayNumber];

  let deadlineText=
    el("deadlineText");

  if(!deadlineString){

    if(deadlineText)
      deadlineText.textContent="—";

    let countdown=el("countdown");

    if(countdown)
      countdown.textContent="";

    return;

  }

  let deadline=new Date(deadlineString);

  if(isNaN(deadline.getTime())){

    if(deadlineText)
      deadlineText.textContent="Deadline non valida";

    return;

  }

  if(deadlineText){

    deadlineText.textContent=
      deadline.toLocaleString("it-IT",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      });

  }

  updateLineupLock(deadline);

  if(window.lineupCountdownInterval)
    clearInterval(window.lineupCountdownInterval);

  window.lineupCountdownInterval=
    setInterval(()=>{

      let currentSelect=el("day");

      if(!currentSelect)
        return;

      let currentOption=
        currentSelect.options[currentSelect.selectedIndex];

      if(!currentOption)
        return;

      let currentNumber=
        Number(currentOption.dataset.number);

      let currentDeadline=
        window.lineupDeadlines?.[currentNumber];

      if(!currentDeadline)
        return;

      updateLineupLock(
        new Date(currentDeadline)
      );

    },1000);

}


/*
  Blocca/sblocca la formazione.
*/

function updateLineupLock(deadline){

  let now=new Date();

  let isFutureDay=
    window.currentLineupDay!==undefined &&
    Number(
      el("day")?.options[
        el("day")?.selectedIndex
      ]?.dataset.number
    )>Number(window.currentLineupDay);

  let locked=
    isFutureDay ||
    !deadline ||
    now>=deadline;

  let countdown=el("countdown");
  let button=el("saveLineupBtn");

  if(!countdown)
    return;

  if(isFutureDay){

    countdown.textContent="🔒 Giornata non ancora disponibile";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Giornata bloccata";

    }

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "Puoi impostare la formazione solo per la giornata attuale.";

    return;

  }

  if(!deadline){

    countdown.textContent="🔒 Formazione chiusa";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Formazione chiusa";

    }

    return;

  }

  if(locked){

    countdown.textContent="🔒 Formazione chiusa";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Formazione chiusa";

    }

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "La deadline è scaduta. Non puoi più modificare la formazione.";

    return;

  }

  let diff=deadline-now;

  let totalSeconds=
    Math.floor(diff/1000);

  let days=
    Math.floor(totalSeconds/86400);

  let hours=
    Math.floor(
      (totalSeconds%86400)/3600
    );

  let minutes=
    Math.floor(
      (totalSeconds%3600)/60
    );

  let seconds=
    totalSeconds%60;

  countdown.textContent=
    "⏱️ Mancano "+
    (days?days+"g ":"")+
    String(hours).padStart(2,"0")+":"+
    String(minutes).padStart(2,"0")+":"+
    String(seconds).padStart(2,"0");

  document.querySelectorAll("#lp select")
    .forEach(x=>{
      x.disabled=false;
    });

  document.querySelectorAll(
    "#lp input[data-captain]"
  ).forEach(x=>{
    x.disabled=false;
  });

  if(button){

    button.disabled=false;
    button.textContent="Salva formazione";

  }

  let status=el("lineupStatus");

  if(status)
    status.textContent="Formazione modificabile.";

}

function updateLineupSummary(){

  let box=el("lineupSummary");

  if(!box)
    return;

  let selects=
    [...document.querySelectorAll("#lp select[data-p]")];

  let groups={
    starter:[],
    sixth:[],
    bench:[],
    out:[]
  };

  selects.forEach(s=>{

    let card=s.closest(".card");

    if(!card)
      return;

    let name=
      card.querySelector("b")?.textContent?.trim()
      || "Giocatore";

    let position=
      s.dataset.pos || "";

    let playerId=
      s.dataset.p;

    let captain=
      document.querySelector(
        `input[data-captain="${playerId}"]`
      )?.checked;

    groups[s.value].push({
      name,
      position,
      captain
    });

  });

  let starters=groups.starter;

  let g=
    starters.filter(x=>x.position==="G").length;

  let a=
    starters.filter(x=>x.position==="A").length;

  let c=
    starters.filter(x=>x.position==="C").length;

  let modulo="";

  if(g===2 && a===2 && c===1)
    modulo="2G – 2A – 1C";

  else if(g===1 && a===3 && c===1)
    modulo="1G – 3A – 1C";

  else if(g===1 && a===2 && c===2)
    modulo="1G – 2A – 2C";

  else if(g===2 && a===1 && c===2)
    modulo="2G – 1A – 2C";

  else if(g===3 && a===1 && c===1)
    modulo="3G – 1A – 1C";


  function playerRow(x){

    return `
      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:6px 0;
        border-bottom:1px solid rgba(255,255,255,.08);
      ">

        <span>
          <b>${x.name}</b>
          ${x.captain ? " 👑" : ""}
          <small class="muted">
            ${x.position}
          </small>
        </span>

      </div>
    `;

  }


  let html=`

    <h3 style="margin-top:0">
      🏀 Formazione attuale
    </h3>

  `;


  if(modulo){

    html+=`
      <div style="
        margin-bottom:12px;
        font-size:16px;
      ">
        <b>Modulo: ${modulo}</b>
      </div>
    `;

  }else{

    html+=`
      <div class="muted" style="margin-bottom:12px;">
        Modulo non ancora completo.
      </div>
    `;

  }


  if(groups.starter.length){

    html+=`
      <div style="margin-top:10px;">
        <b>🏀 Titolari</b>
        ${groups.starter.map(playerRow).join("")}
      </div>
    `;

  }


  if(groups.sixth.length){

    html+=`
      <div style="margin-top:12px;">
        <b>6️⃣ Sesto uomo</b>
        ${groups.sixth.map(playerRow).join("")}
      </div>
    `;

  }


  if(groups.bench.length){

    html+=`
      <div style="margin-top:12px;">
        <b>🪑 Panchina</b>
        ${groups.bench.map(playerRow).join("")}
      </div>
    `;

  }


  if(groups.out.length){

    html+=`
      <div style="margin-top:12px;">
        <b>❌ Fuori</b>
        ${groups.out.map(playerRow).join("")}
      </div>
    `;

  }


  box.innerHTML=html;

}

      "err"
    );

  let selected=
    select.options[select.selectedIndex];

  if(!selected)
    return message(

      "err"
    );

let matchdayId=selected.value;

let matchdayNumber=
  Number(selected.dataset.number);

console.log("SAVE MATCHDAY ID:",matchdayId);
console.log(
  "SAVE MATCHDAY NUMBER:",
  matchdayNumber
);

/*
  Le giornate future non possono mai essere modificate.
*/

if(
  window.currentLineupDay!==undefined &&
  matchdayNumber>Number(window.currentLineupDay)
){

  return message(
    "Questa giornata non è ancora disponibile. Devi aspettare la conclusione della giornata attuale.",
    "err"
  );

}

/*
  La giornata deve avere l'UUID.
*/

if(!matchdayId)
  return message(
    "ID giornata non valido.",
    "err"
  );

  let deadline=
    window.lineupDeadlines?.[matchdayNumber];

  if(!deadline)
    return message(
      "Deadline non disponibile per questa giornata.",
      "err"
    );

  if(new Date()>=new Date(deadline))
    return message(
      "La deadline per questa giornata è scaduta. La formazione non può più essere modificata.",
      "err"
    );

  let selects=[
    ...document.querySelectorAll(
      "#lp select[data-p]"
    )
  ];

  if(selects.length!==13)
    return message(
      "La rosa deve avere 13 giocatori.",
      "err"
    );

  let starters=
    selects.filter(
      s=>s.value==="starter"
    );

  let sixth=
    selects.filter(
      s=>s.value==="sixth"
    );

  let bench=
    selects.filter(
      s=>s.value==="bench"
    );

  let out=
    selects.filter(
      s=>s.value==="out"
    );

  if(starters.length!==5)
    return message(
      "Devi avere 5 titolari.",
      "err"
    );

  if(sixth.length!==1)
    return message(
      "Devi avere 1 sesto uomo.",
      "err"
    );

  if(bench.length!==4)
    return message(
      "Devi avere 4 panchinari.",
      "err"
    );

  if(out.length!==3)
    return message(
      "Devi avere 3 giocatori fuori.",
      "err"
    );

  let g=
    starters.filter(
      s=>s.dataset.pos==="G"
    ).length;

  let a=
    starters.filter(
      s=>s.dataset.pos==="A"
    ).length;

  let c=
    starters.filter(
      s=>s.dataset.pos==="C"
    ).length;

  let moduloValido=
    (g===2&&a===2&&c===1) ||
    (g===1&&a===3&&c===1) ||
    (g===1&&a===2&&c===2) ||
    (g===2&&a===1&&c===2);

  if(!moduloValido)
    return message(
      "Modulo non valido. Moduli consentiti: 2G-2A-1C, 1G-3A-1C, 1G-2A-2C, 2G-1A-2C.",
      "err"
    );

  let captains=[
    ...document.querySelectorAll(
      'input[data-captain]:checked'
    )
  ];

  if(captains.length!==1)
    return message(
      "Devi scegliere un capitano.",
      "err"
    );

  let captainId=
    captains[0].dataset.captain;

  /*
    Cerca la formazione esistente.
  */

  let old=await db.from("lineups")
    .select("id")
    .eq("manager_id",me.id)
    .eq("matchday_id",matchdayId)
    .maybeSingle();

  if(old.error)
    return message(
      old.error.message,
      "err"
    );

  let lid=old.data?.id;

  /*
    Se non esiste, la crea.
  */

  if(!lid){

    let x=await db.from("lineups")
      .insert({
        manager_id:me.id,
        matchday_id:matchdayId
      })
      .select("id")
      .single();

    if(x.error)
      return message(
        x.error.message,
        "err"
      );

    lid=x.data.id;

  }

  /*
    Cancella i giocatori precedenti.
  */

  let d=await db.from("lineup_players")
    .delete()
    .eq("lineup_id",lid);

  if(d.error)
    return message(
      d.error.message,
      "err"
    );

  /*
    Inserisce la formazione aggiornata.
  */

  let vals=selects.map(s=>({

    lineup_id:lid,
    player_id:s.dataset.p,
    role:s.value,
    captain:s.dataset.p===captainId

  }));

  let x=await db.from("lineup_players")
    .insert(vals);

  if(x.error)
    return message(
      x.error.message,
      "err"
    );

  message(
    "Formazione salvata correttamente.",
    "ok"
  );

  /*
    Ricarica la formazione dal database,
    così la schermata rappresenta
    esattamente ciò che è stato salvato.
  */

  await loadSavedLineup();

}

      "err"
    );

      "err"
    );

      "err"
    );


  let x=await db
    .from("trades")
    .insert({

      receiver_id:receiverId,

      offered_player_id:offeredPlayerId,

      requested_player_id:requestedPlayerId,

      message:"Proposta di scambio",

      status:"pending"

    });


  if(x.error)
    return message(
      x.error.message,
      "err"
    );

async function calendar(){

  let r=await db.from("league_matches")
    .select(`
      id,
      matchday_number,
      home_manager_id,
      away_manager_id,
      home_score,
      away_score
    `)
    .order("matchday_number")
    .order("id");

  if(r.error)
    return message(r.error.message,"err");

  let matches=r.data||[];

  let managerIds=[
    ...new Set(
      matches.flatMap(x=>[
        x.home_manager_id,
        x.away_manager_id
      ])
    )
  ];

  let managers={};

  if(managerIds.length){

let m=await db.from("managers")
  .select(`
    id,
    name,
    team_name
  `)
  .in("id",managerIds);

    if(m.error)
      return message(m.error.message,"err");

    (m.data||[]).forEach(x=>{
      managers[x.id]=x;
    });

  }

  /*
    Recuperiamo gli ID delle giornate.
    Sono UUID e NON i numeri 1, 2, 3...
  */

  let matchdayNumbers=[
    ...new Set(matches.map(x=>x.matchday_number))
  ];

  let md=await db.from("matchdays")
    .select("id,number")
    .in("number",matchdayNumbers);

  if(md.error)
    return message(md.error.message,"err");

  let matchdays={};
  let matchdayIds=[];

  (md.data||[]).forEach(x=>{
    matchdays[x.number]=x.id;
    matchdayIds.push(x.id);
  });

  /*
    Recuperiamo tutte le formazioni delle giornate presenti
    nel calendario.
  */

  let lineups=[];

  if(managerIds.length && matchdayIds.length){

    let l=await db.from("lineups")
      .select("id,manager_id,matchday_id")
      .in("manager_id",managerIds)
      .in("matchday_id",matchdayIds);

    if(l.error)
      return message(l.error.message,"err");

    lineups=l.data||[];

  }

  /*
    Mappa:
    manager + giornata -> lineup
  */

  let lineupMap={};

  lineups.forEach(l=>{
    lineupMap[
      l.manager_id+"_"+l.matchday_id
    ]=l;
  });

  /*
    Recuperiamo i giocatori presenti nelle formazioni.
  */

  let lineupIds=lineups.map(x=>x.id);

  let lineupPlayers=[];

  if(lineupIds.length){

    let lp=await db.from("lineup_players")
      .select(`
        lineup_id,
        player_id,
        role,
        captain
      `)
      .in("lineup_id",lineupIds);

    if(lp.error)
      return message(lp.error.message,"err");

    lineupPlayers=lp.data||[];

  }

  /*
    Recuperiamo i dati dei giocatori.
  */

  let playerIds=[
    ...new Set(lineupPlayers.map(x=>x.player_id))
  ];

  let players={};

  if(playerIds.length){

    let p=await db.from("players")
      .select("id,name,position")
      .in("id",playerIds);

    if(p.error)
      return message(p.error.message,"err");

    (p.data||[]).forEach(x=>{
      players[x.id]=x;
    });

  }

  /*
    Recuperiamo anche i punteggi fantasy, quando disponibili.
  */

  let fantasyScores=[];

  if(managerIds.length && matchdayIds.length){

    let fs=await db.from("fantasy_scores")
      .select(`
        manager_id,
        matchday_id,
        player_id,
        final_score
      `)
      .in("manager_id",managerIds)
      .in("matchday_id",matchdayIds);

    if(fs.error)
      return message(fs.error.message,"err");

    fantasyScores=fs.data||[];

  }

  let scoreMap={};

  fantasyScores.forEach(x=>{

    scoreMap[
      x.manager_id+"_"+x.matchday_id+"_"+x.player_id
    ]=x.final_score;

  });

  /*
    Funzione che costruisce la formazione di un fantallenatore.
  */

  function renderLineup(managerId,dayNumber){

    let matchdayId=matchdays[dayNumber];

    if(!matchdayId)
      return `<p class="muted">Giornata non trovata.</p>`;

    let lineup=
      lineupMap[managerId+"_"+matchdayId];

    if(!lineup){

      return `
        <div class="muted">
          Nessuna formazione salvata.
        </div>
      `;

    }

    let lp=lineupPlayers
      .filter(x=>x.lineup_id===lineup.id);

    if(!lp.length){

      return `
        <div class="muted">
          Formazione vuota.
        </div>
      `;

    }

    let starters=[];
    let sixth=[];
    let bench=[];
    let out=[];

    lp.forEach(x=>{

      let player=players[x.player_id];

      if(!player)
        return;

      let item={
        ...x,
        player
      };

      if(x.role==="starter")
        starters.push(item);
      else if(x.role==="sixth")
        sixth.push(item);
      else if(x.role==="bench")
        bench.push(item);
      else
        out.push(item);

    });

    function playerRow(x){

      let score=
        scoreMap[
          managerId+"_"+matchdayId+"_"+x.player_id
        ];

      let captain=
        x.captain
          ? ` 👑`
          : "";

      let scoreText=
        score!==undefined && score!==null
          ? `<span class="muted">${score}</span>`
          : "";

      return `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:6px 0;
          border-bottom:1px solid rgba(255,255,255,.08);
        ">
          <span>
            <b>${x.player.name}</b>
            ${captain}
            <small class="muted">
              ${x.player.position||""}
            </small>
          </span>
          <span>
            ${scoreText}
          </span>
        </div>
      `;

    }

    let html="";

    if(starters.length){

      html+=`
        <div style="margin-top:10px;">
          <b>🏀 Titolari</b>
          ${starters.map(playerRow).join("")}
        </div>
      `;

    }

    if(sixth.length){

      html+=`
        <div style="margin-top:12px;">
          <b>6️⃣ Sesto uomo</b>
          ${sixth.map(playerRow).join("")}
        </div>
      `;

    }

    if(bench.length){

      html+=`
        <div style="margin-top:12px;">
          <b>🪑 Panchina</b>
          ${bench.map(playerRow).join("")}
        </div>
      `;

    }

    if(out.length){

      html+=`
        <div style="margin-top:12px;">
          <b>❌ Fuori</b>
          ${out.map(playerRow).join("")}
        </div>
      `;

    }

    return html;

  }

  let days={};

  matches.forEach(x=>{

    if(!days[x.matchday_number])
      days[x.matchday_number]=[];

    days[x.matchday_number].push(x);

  });

  let html=`

    <div class="card">

      <h2>Calendario</h2>

      <p class="muted">
        Calendario completo del campionato
      </p>

    </div>

  `;

  Object.keys(days)
    .sort((a,b)=>Number(a)-Number(b))
    .forEach(day=>{

      html+=`

        <div class="card">

          <h2>Giornata ${day}</h2>

          <table>

            <tr>
              <th>Casa</th>
              <th></th>
              <th>Trasferta</th>
            </tr>

      `;

      days[day].forEach(x=>{

        let homeManager=
          managers[x.home_manager_id];

        let awayManager=
          managers[x.away_manager_id];

       let homeName=
  homeManager?.team_name ||
  homeManager?.name ||
  "—";

let awayName=
  awayManager?.team_name ||
  awayManager?.name ||
  "—";

let homeLogo=coachMap[x.home_manager_id]?.logo_url || "";
let awayLogo=coachMap[x.away_manager_id]?.logo_url || "";

let homeManagerSmall=
  homeManager?.name || "";

let awayManagerSmall=
  awayManager?.name || "";

        let score="";

        if(
          x.home_score!==null &&
          x.home_score!==undefined &&
          x.away_score!==null &&
          x.away_score!==undefined
        ){

          score=`
            <b>${x.home_score} - ${x.away_score}</b>
          `;

        }

        html+=`

          <tr>

<td>
  <b>${homeName}</b>
  <br>
  <small class="muted">
    ${homeManagerSmall}
  </small>
</td>

            <td>
              ${score||"vs"}
            </td>

<td>
  <b>${awayName}</b>
  <br>
  <small class="muted">
    ${awayManagerSmall}
  </small>
</td>

          </tr>

          <tr>

            <td colspan="3">

              <details>

                <summary style="
                  cursor:pointer;
                  padding:8px 0;
                  font-weight:bold;
                ">
                  👀 Vedi formazioni
                </summary>

                <div style="
                  display:grid;
                  grid-template-columns:1fr 1fr;
                  gap:20px;
                  margin-top:15px;
                ">

                  <div>

<h3>
  ${homeName}
  <div class="muted" style="font-size:13px;font-weight:normal">
    ${homeManagerSmall}
  </div>
</h3>

                    ${renderLineup(
                      x.home_manager_id,
                      x.matchday_number
                    )}

                  </div>

                  <div>

<h3>
  ${awayName}
  <div class="muted" style="font-size:13px;font-weight:normal">
    ${homeManagerSmall}
  </div>
</h3>

                    ${renderLineup(
                      x.away_manager_id,
                      x.matchday_number

                  </div>

                </div>

              </details>

            </td>

          </tr>

        `;

      });

      html+=`

          </table>

        </div>

      `;

    });

  el("content").innerHTML=html;

}

async function addPlayerToRoster(){
let manager=el("am").value;
let player=el("ap").value;
let price=Number(el("price").value);

if(!price||price<1)return message("Inserisci un prezzo valido.","err");

let cm=await db.from("managers")
.select("credits")
.eq("id",manager)
.single();

if(cm.error)return message(cm.error.message,"err");

let credits=Number(cm.data.credits);

if(price>credits)return message("Crediti insufficienti.","err");

let rosa=await db.from("rosters")
.select("player_id,players(position)")
.eq("manager_id",manager)
.eq("active",true);

if(rosa.error)return message(rosa.error.message,"err");

if((rosa.data||[]).length>=13)
return message("La rosa è già completa (13 giocatori).","err");

let already=await db.from("rosters")
.select("id")
.eq("player_id",player)
.eq("active",true)
.maybeSingle();

if(already.error)return message(already.error.message,"err");

if(already.data)
return message("Questo giocatore è già stato assegnato.","err");

let info=await db.from("players")
.select("position,is_foreign")
.eq("id",player)
.single();

if(info.error)return message(info.error.message,"err");

let ruolo=info.data.position;

let guardie=(rosa.data||[]).filter(x=>x.players?.position==="G").length;
let ali=(rosa.data||[]).filter(x=>x.players?.position==="A").length;
let centri=(rosa.data||[]).filter(x=>x.players?.position==="C").length;

if(ruolo==="G" && guardie>=5)
return message("Hai già 5 guardie.","err");

if(ruolo==="A" && ali>=5)
return message("Hai già 5 ali.","err");

if(ruolo==="C" && centri>=3)
return message("Hai già 3 centri.","err");

if(info.data.is_foreign){
let stranieri=await db.from("rosters")
.select("player_id,players(is_foreign)")
.eq("manager_id",manager)
.eq("active",true);

if((stranieri.data||[]).some(x=>x.players?.is_foreign))
return message("Hai già uno straniero in rosa.","err");
}

let x=await db.from("rosters").insert({
manager_id:manager,
player_id:player,
purchase_price:price,
active:true
});

if(x.error)return message(x.error.message,"err");

let u=await db.rpc("subtract_credits",{
manager_id_input:manager,
amount_input:price
});

if(u.error)return message("Errore aggiornamento crediti: "+u.error.message,"err");

message("Giocatore assegnato alla rosa.","ok");
admin();
}

.delete()

admin();
}

if(price>credits)
return message("Crediti insufficienti.","err");

let existing=await db.from("manager_coaches")
.select("id")
.eq("manager_id",manager)
.eq("active",true)
.maybeSingle();

if(existing.error)
return message(existing.error.message,"err");

if(existing.data)
return message("Questo fantallenatore ha già un allenatore.","err");

let already=await db.from("manager_coaches")
.select("id")
.eq("real_team_id",realTeam)
.eq("active",true)
.maybeSingle();

if(already.error)
return message(already.error.message,"err");

if(already.data)
return message("Questo allenatore è già stato assegnato a un altro fantallenatore.","err");

let x=await db.from("manager_coaches")
.insert({
manager_id:manager,
real_team_id:realTeam,
purchase_price:price,
active:true
});

if(x.error)
return message(x.error.message,"err");

let u=await db.rpc("subtract_credits",{
manager_id_input:manager,
amount_input:price
});

if(u.error)
return message(
"Errore aggiornamento crediti: "+u.error.message,
"err"
);

message("Allenatore assegnato alla rosa.","ok");

admin();

}


async function removeCoachFromRoster(coachId){

let r=await db.from("manager_coaches")
.select("manager_id,purchase_price")
.eq("id",coachId)
.single();

if(r.error)
return message(r.error.message,"err");

let u=await db.rpc("add_credits",{
manager_id_input:r.data.manager_id,
amount_input:r.data.purchase_price
});

if(u.error)
return message(
"Errore restituzione crediti: "+u.error.message,
"err"
);

let x=await db.from("manager_coaches")
.delete()
.eq("id",coachId);

if(x.error)
return message(x.error.message,"err");

message(
"Allenatore rimosso e crediti restituiti.",
"ok"
);

admin();

}
boot();
