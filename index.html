function renderPlayers(a){

  el("pt").innerHTML=`

    <table>

      <tr>
        <th>Giocatore</th>
        <th>Ruolo</th>

        <th>Str.</th>
      </tr>

      ${a.map(p=>`

        <tr>

          <td>${p.name}</td>

          <td>
            ${p.position||"Da definire"}
          </td>

          <td>
            ${p.real_teams?.name||"Da definire"}
          </td>

          <td>
            ${p.is_foreign?"Sì":""}
          </td>

        </tr>

      `).join("")}

    </table>

  `;

}


function filterPlayers(){

  let q=(el("q")?.value||"").toLowerCase().trim();

  let role=el("roleFilter")?.value||"";

  let team=el("teamFilter")?.value||"";

  let foreign=el("foreignFilter")?.value||"";

  let filtered=window.pc.filter(p=>{

    let name=(p.name||"").toLowerCase();

    let teamName=(p.real_teams?.name||"").toLowerCase();

    if(q && !name.includes(q) && !teamName.includes(q))
      return false;

    if(role && p.position!==role)
      return false;

    if(team && String(p.real_teams?.id)!==String(team))
      return false;

    if(foreign==="yes" && !p.is_foreign)
      return false;

    if(foreign==="no" && p.is_foreign)
      return false;

    return true;

  });

  renderPlayers(filtered);

}

async function lineup(){

  let m=await db.from("matchdays")
    .select("id,number,lineup_deadline,status")
    .order("number");

  let r=await db.from("rosters")
    .select("player_id,players(name,position)")
    .eq("manager_id",me.id)
    .eq("active",true);

  if(m.error)
    return message(m.error.message,"err");

  if(r.error)
    return message(r.error.message,"err");

  let days=m.data||[];

  /*
    Trova la prima giornata non ancora conclusa.
  */

  let matches=await db.from("league_matches")
    .select("matchday_number,home_score,away_score");

  if(matches.error)
    return message(matches.error.message,"err");

  let grouped={};

  (matches.data||[]).forEach(x=>{

    if(!grouped[x.matchday_number])
      grouped[x.matchday_number]=[];

    grouped[x.matchday_number].push(x);

  });

  let currentDay=null;

  for(let day of days){

    let number=day.number;
    let dayMatches=grouped[number]||[];

    let completed=
      dayMatches.length>0 &&
      dayMatches.every(x=>
        x.home_score!==null &&
        x.home_score!==undefined &&
        x.away_score!==null &&
        x.away_score!==undefined
      );

    if(!completed){

      currentDay=number;
      break;

    }

  }

  if(currentDay===null && days.length){

    currentDay=days[days.length-1].number;

  }

  /*
    Mostra la giornata attuale e quelle precedenti.
  */

  let currentIndex=
    days.findIndex(x=>x.number===currentDay);

  let availableDays=
    currentIndex>=0
    ? days.slice(0,currentIndex+1)
    : days;

  /*
    Salva le deadline disponibili.
  */

  window.lineupDeadlines={};

  availableDays.forEach(x=>{

    window.lineupDeadlines[x.number]=
      x.lineup_deadline;

  });

  /*
    Costruisce la schermata.
  */

  el("content").innerHTML=`

    <div class="card">

      <h2>Formazione</h2>

      <select id="day"
              onchange="loadSavedLineup()">

        ${availableDays.map(x=>`

          <option
            value="${x.id}"
            data-number="${x.number}"
            ${x.number===currentDay?"selected":""}>

            Giornata ${x.number}
            ${x.number===currentDay?" · ATTUALE":""}

          </option>

        `).join("")}

      </select>


      <div id="deadlineBox" class="card">

        <b>Deadline formazione:</b>

        <span id="deadlineText">—</span>

        <div
          id="countdown"
          style="font-size:22px;margin-top:8px">
        </div>

      </div>


      <div id="lp">

        ${(r.data||[]).map(x=>`

          <div class="card">

            <b>${x.players.name}</b>
            · ${x.players.position}

            <select
              data-p="${x.player_id}"
              data-pos="${x.players.position}">

              <option value="out">
                Fuori
              </option>

              <option value="starter">
                Titolare · 100%
              </option>

              <option value="sixth">
                Sesto uomo · 100%
              </option>

              <option value="bench">
                Panchina · 50%
              </option>

            </select>


            <label>

              <input
                type="checkbox"
                data-captain="${x.player_id}"
                onchange="checkCaptain(this)">

              Capitano

            </label>

          </div>

        `).join("")}

      </div>


      <div id="lineupStatus"
           class="muted">
      </div>


      <button
        id="saveLineupBtn"
        onclick="saveLineup()">

        Salva formazione

      </button>


      <p class="muted">

        5 titolari: 2G + 2A + 1C ·
        1 sesto uomo ·
        4 panchinari 50% ·
        3 fuori ·
        1 capitano.

      </p>

    </div>

  `;

  /*
    Carica subito la formazione della giornata attuale.
  */

  await loadSavedLineup();

}


/*
  Carica la formazione già salvata
  per la giornata selezionata.
*/

async function loadSavedLineup(){

  let select=el("day");

  if(!select)
    return;

  let selected=select.options[select.selectedIndex];

  if(!selected)
    return;

  let matchdayId=selected.value;
  let matchdayNumber=Number(selected.dataset.number);

  console.log("MATCHDAY ID:",matchdayId);
  console.log("MATCHDAY NUMBER:",matchdayNumber);

  /*
    Aggiorna deadline e countdown.
  */

  updateLineupDeadline();

  /*
    Cerca la formazione già salvata.
  */

  let x=await db.from("lineups")
    .select("id")
    .eq("manager_id",me.id)
    .eq("matchday_id",matchdayId)
    .maybeSingle();

  if(x.error)
    return message(x.error.message,"err");

  /*
    Azzera la schermata prima di caricare
    la formazione della giornata scelta.
  */

  document.querySelectorAll("#lp select[data-p]")
    .forEach(s=>s.value="out");

  document.querySelectorAll("#lp input[data-captain]")
    .forEach(c=>c.checked=false);

  /*
    Nessuna formazione ancora salvata.
  */

  if(!x.data){

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "Nessuna formazione salvata per questa giornata.";

    let deadline=
      window.lineupDeadlines?.[matchdayNumber];

    if(deadline)
      updateLineupLock(new Date(deadline));

    return;

  }

  /*
    Carica i giocatori della formazione.
  */

  let lp=await db.from("lineup_players")
    .select("player_id,role,captain")
    .eq("lineup_id",x.data.id);

  if(lp.error)
    return message(lp.error.message,"err");

  /*
    Applica ruoli e capitano.
  */

  (lp.data||[]).forEach(p=>{

    let playerSelect=document.querySelector(
      `#lp select[data-p="${p.player_id}"]`
    );

    if(playerSelect)
      playerSelect.value=p.role;

    let captain=document.querySelector(
      `#lp input[data-captain="${p.player_id}"]`
    );

    if(captain)
      captain.checked=!!p.captain;

  });

  let status=el("lineupStatus");

  if(status)
    status.textContent="Formazione salvata.";

  /*
    Applica nuovamente il blocco corretto
    in base alla deadline.
  */

  let deadline=
    window.lineupDeadlines?.[matchdayNumber];

  if(deadline)
    updateLineupLock(new Date(deadline));

}


/*
  Aggiorna deadline e countdown.
*/

function updateLineupDeadline(){

  let select=el("day");

  if(!select)
    return;

  let selected=select.options[select.selectedIndex];

  if(!selected)
    return;

  let matchdayNumber=
    Number(selected.dataset.number);

  let deadlineString=
    window.lineupDeadlines?.[matchdayNumber];

  let deadlineText=
    el("deadlineText");

  if(!deadlineString){

    if(deadlineText)
      deadlineText.textContent="—";

    let countdown=el("countdown");

    if(countdown)
      countdown.textContent="";

    return;

  }

  let deadline=new Date(deadlineString);

  if(isNaN(deadline.getTime())){

    if(deadlineText)
      deadlineText.textContent="Deadline non valida";

    return;

  }

  if(deadlineText){

    deadlineText.textContent=
      deadline.toLocaleString("it-IT",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      });

  }

  updateLineupLock(deadline);

  if(window.lineupCountdownInterval)
    clearInterval(window.lineupCountdownInterval);

  window.lineupCountdownInterval=
    setInterval(()=>{

      let currentSelect=el("day");

      if(!currentSelect)
        return;

      let currentOption=
        currentSelect.options[currentSelect.selectedIndex];

      if(!currentOption)
        return;

      let currentNumber=
        Number(currentOption.dataset.number);

      let currentDeadline=
        window.lineupDeadlines?.[currentNumber];

      if(!currentDeadline)
        return;

      updateLineupLock(
        new Date(currentDeadline)
      );

    },1000);

}


/*
  Blocca/sblocca la formazione.
*/

function updateLineupLock(deadline){

  let now=new Date();
  let locked=now>=deadline;

  let countdown=el("countdown");
  let button=el("saveLineupBtn");

  if(!countdown)
    return;

  if(locked){

    countdown.textContent="🔒 Formazione chiusa";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Formazione chiusa";

    }

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "La deadline è scaduta. Non puoi più modificare la formazione.";

    return;

  }

  let diff=deadline-now;

  let totalSeconds=
    Math.floor(diff/1000);

  let days=
    Math.floor(totalSeconds/86400);

  let hours=
    Math.floor(

    );

    );

async function saveLineup(){

  let select=el("day");

  if(!select)
    return message(
      "Seleziona una giornata.",
      "err"
    );

  let selected=
    select.options[select.selectedIndex];

  if(!selected)
    return message(
      "Seleziona una giornata.",
      "err"
    );

  let matchdayId=selected.value;
  let matchdayNumber=
    Number(selected.dataset.number);

  console.log("SAVE MATCHDAY ID:",matchdayId);
  console.log(
    "SAVE MATCHDAY NUMBER:",
    matchdayNumber
  );

  /*
    La giornata deve avere l'UUID.
  */

  if(!matchdayId)
    return message(
      "ID giornata non valido.",
      "err"
    );

  let deadline=
    window.lineupDeadlines?.[matchdayNumber];

  if(!deadline)
    return message(
      "Deadline non disponibile per questa giornata.",
      "err"
    );

  if(new Date()>=new Date(deadline))
    return message(
      "La deadline per questa giornata è scaduta. La formazione non può più essere modificata.",
      "err"
    );

  let selects=[
    ...document.querySelectorAll(
      "#lp select[data-p]"
    )
  ];

  if(selects.length!==13)
    return message(
      "La rosa deve avere 13 giocatori.",
      "err"
    );

  let starters=
    selects.filter(
      s=>s.value==="starter"
    );

  let sixth=
    selects.filter(
      s=>s.value==="sixth"
    );

  let bench=
    selects.filter(
      s=>s.value==="bench"
    );

  let out=
    selects.filter(
      s=>s.value==="out"
    );

  if(starters.length!==5)
    return message(
      "Devi avere 5 titolari.",
      "err"
    );

  if(sixth.length!==1)
    return message(
      "Devi avere 1 sesto uomo.",
      "err"
    );

  if(bench.length!==4)
    return message(
      "Devi avere 4 panchinari.",
      "err"
    );

  if(out.length!==3)
    return message(
      "Devi avere 3 giocatori fuori.",
      "err"
    );

  let g=
    starters.filter(
      s=>s.dataset.pos==="G"
    ).length;

  let a=
    starters.filter(
      s=>s.dataset.pos==="A"
    ).length;

  let c=
    starters.filter(
      s=>s.dataset.pos==="C"
    ).length;

  let moduloValido=
    (g===2&&a===2&&c===1) ||
    (g===1&&a===3&&c===1) ||
    (g===1&&a===2&&c===2) ||
    (g===2&&a===1&&c===2);

  if(!moduloValido)
    return message(
      "Modulo non valido. Moduli consentiti: 2G-2A-1C, 1G-3A-1C, 1G-2A-2C, 2G-1A-2C.",
      "err"
    );

  let captains=[
    ...document.querySelectorAll(
      'input[data-captain]:checked'
    )
  ];

  if(captains.length!==1)
    return message(
      "Devi scegliere un capitano.",
      "err"
    );

  let captainId=
    captains[0].dataset.captain;

  /*
    Cerca la formazione esistente.
  */

  let old=await db.from("lineups")
    .select("id")
    .eq("manager_id",me.id)
    .eq("matchday_id",matchdayId)
    .maybeSingle();

  if(old.error)
    return message(
      old.error.message,
      "err"
    );

  let lid=old.data?.id;

  /*
    Se non esiste, la crea.
  */

  if(!lid){

    let x=await db.from("lineups")
      .insert({
        manager_id:me.id,
        matchday_id:matchdayId
      })
      .select("id")
      .single();

    if(x.error)
      return message(
        x.error.message,
        "err"
      );

    lid=x.data.id;

  }

  /*
    Cancella i giocatori precedenti.
  */

  let d=await db.from("lineup_players")
    .delete()
    .eq("lineup_id",lid);

  if(d.error)
    return message(
      d.error.message,
      "err"
    );

  /*
    Inserisce la formazione aggiornata.
  */

  let vals=selects.map(s=>({

    lineup_id:lid,
    player_id:s.dataset.p,
    role:s.value,
    captain:s.dataset.p===captainId

  }));

  let x=await db.from("lineup_players")
    .insert(vals);

  if(x.error)
    return message(
      x.error.message,
      "err"
    );

  message(
    "Formazione salvata correttamente.",
    "ok"
  );

  /*
    Ricarica la formazione dal database,
    così la schermata rappresenta
    esattamente ciò che è stato salvato.
  */

  await loadSavedLineup();

}

async function calendar(){

let r=await db.from("league_matches")
.select(`
  id,
  matchday_number,
  home_manager_id,
  away_manager_id,
  home_score,
  away_score
`)
.order("matchday_number")
.order("id");

if(r.error)
return message(r.error.message,"err");

let matches=r.data||[];

let managerIds=[
  ...new Set(
    matches.flatMap(x=>[
      x.home_manager_id,
      x.away_manager_id
    ])
  )
];

let managers={};

if(managerIds.length){

let m=await db.from("managers")
.select("id,name,team_name")
.in("id",managerIds);

if(m.error)
return message(m.error.message,"err");

(m.data||[]).forEach(x=>{
  managers[x.id]=x;
});

}

let days={};

matches.forEach(x=>{

  if(!days[x.matchday_number])
    days[x.matchday_number]=[];

  days[x.matchday_number].push(x);

});

<div class="card">

<h2>Calendario</h2>

<p class="muted">
Calendario completo del campionato
</p>

</div>

`;

Object.keys(days)
.sort((a,b)=>Number(a)-Number(b))

html+=`

<th>Casa</th>

<th>Trasferta</th>

let awayManager=managers[x.away_manager_id];

homeManager?.team_name ||
(homeManager?.name==="Zillo" ? "Zillovic" : homeManager?.name) ||
"—";

let awayName=
awayManager?.team_name ||
(awayManager?.name==="Zillo" ? "Zillovic" : awayManager?.name) ||
"—";

let score="";

if(
  x.home_score!==null &&
  x.home_score!==undefined &&
  x.away_score!==null &&
  x.away_score!==undefined
){

score=`
<b>${x.home_score} - ${x.away_score}</b>
`;

}

html+=`

<tr>

<td>
<b>${homeName}</b>
</td>

<td>
${score||"vs"}
</td>

<td>
<b>${awayName}</b>
</td>

</tr>

});

</table>

</div>

});

async function addCoachToManager(){

let manager=el("coachManager").value;
let team=el("coachTeam").value;
let price=Number(el("coachPrice").value);

if(!price || price<1)
return message("Inserisci un prezzo valido.","err");


let cm=await db.from("managers")
.select("credits")
.eq("id",manager)
.single();

if(cm.error)
return message(cm.error.message,"err");

let credits=Number(cm.data.credits);

if(price>credits)
return message("Crediti insufficienti.","err");


let existing=await db.from("manager_coaches")
.select("id")
.eq("manager_id",manager)
.eq("active",true)
.maybeSingle();

if(existing.error)
return message(existing.error.message,"err");

if(existing.data)
return message(
"Questo fantallenatore ha già un allenatore.",
"err"
);


let already=await db.from("manager_coaches")
.select("id")
.eq("real_team_id",team)
.eq("active",true)
.maybeSingle();

if(already.error)
return message(already.error.message,"err");

if(already.data)
return message(
"Questo allenatore è già stato acquistato da un altro fantallenatore.",
"err"
);


let x=await db.from("manager_coaches")
.insert({

manager_id:manager,
real_team_id:team,
purchase_price:price,
active:true

});

if(x.error)
return message(x.error.message,"err");


let u=await db.rpc("subtract_credits",{

manager_id_input:manager,
amount_input:price

});

if(u.error)
return message(
"Errore aggiornamento crediti: "+u.error.message,
"err"
);


message(
"Allenatore assegnato correttamente.",
"ok"
);

admin();

}
async function addPlayerToRoster(){
let manager=el("am").value;
let player=el("ap").value;
let price=Number(el("price").value);

if(!price||price<1)return message("Inserisci un prezzo valido.","err");

let cm=await db.from("managers")
.select("credits")
.eq("id",manager)
.single();

if(cm.error)return message(cm.error.message,"err");

let credits=Number(cm.data.credits);

if(price>credits)return message("Crediti insufficienti.","err");

let rosa=await db.from("rosters")
.select("player_id,players(position)")
.eq("manager_id",manager)
.eq("active",true);

if(rosa.error)return message(rosa.error.message,"err");

if((rosa.data||[]).length>=13)
return message("La rosa è già completa (13 giocatori).","err");

let already=await db.from("rosters")
.select("id")
.eq("player_id",player)
.eq("active",true)
.maybeSingle();

if(already.error)return message(already.error.message,"err");

if(already.data)
return message("Questo giocatore è già stato assegnato.","err");

let info=await db.from("players")
.select("position,is_foreign")
.eq("id",player)
.single();

if(info.error)return message(info.error.message,"err");

let ruolo=info.data.position;

let guardie=(rosa.data||[]).filter(x=>x.players?.position==="G").length;
let ali=(rosa.data||[]).filter(x=>x.players?.position==="A").length;
let centri=(rosa.data||[]).filter(x=>x.players?.position==="C").length;

if(ruolo==="G" && guardie>=5)
return message("Hai già 5 guardie.","err");

if(ruolo==="A" && ali>=5)
return message("Hai già 5 ali.","err");

if(ruolo==="C" && centri>=3)
return message("Hai già 3 centri.","err");

if(info.data.is_foreign){
let stranieri=await db.from("rosters")
.select("player_id,players(is_foreign)")
.eq("manager_id",manager)
.eq("active",true);

if((stranieri.data||[]).some(x=>x.players?.is_foreign))
return message("Hai già uno straniero in rosa.","err");
}

let x=await db.from("rosters").insert({
manager_id:manager,
player_id:player,
purchase_price:price,
active:true
});

if(x.error)return message(x.error.message,"err");

let u=await db.rpc("subtract_credits",{
manager_id_input:manager,
amount_input:price
});

if(u.error)return message("Errore aggiornamento crediti: "+u.error.message,"err");

message("Giocatore assegnato alla rosa.","ok");
admin();
}

}
