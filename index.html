<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FantaBasket Orzi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}header{padding:16px 22px;background:#11182c;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:22px}.card{background:#121a30;border:1px solid #293452;border-radius:14px;padding:18px;margin-bottom:16px}button{background:#4f46e5;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;margin:3px}button.secondary{background:#26314d}input,select{background:#0d1528;color:white;border:1px solid #394563;border-radius:8px;padding:10px;width:100%;margin:5px 0 12px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #293452}.muted{color:#9da9c4}.err{background:#3b1821;padding:10px;border-radius:8px}.ok{background:#143522;padding:10px;border-radius:8px}
</style></head><body>
<header><div><b>🏀 FantaBasket Orzi</b><div id="who" class="muted">Non autenticato</div></div><div id="authBtn"><button onclick="showAuth()">Accedi</button></div></header>
<main><div id="msg"></div>
<section id="auth" class="card hidden"><h2>Accedi</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><label>Nome fantallenatore (solo alla registrazione)</label><input id="managerName" placeholder="Zillo / Picco / Mino / Albi / Pevez / Bedo / Ventu / Dello / Tommi"><button onclick="login()">Accedi</button><button class="secondary" onclick="signup()">Registrati</button><button class="secondary" onclick="hideAuth()">Chiudi</button></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section>
</main>
<script>
const URL="https://ejzipstmvofhjsqrzvfs.supabase.co",KEY="sb_publishable_nNqB08asItxVhY0WAeGXKQ_fKGRC5va";
const db=supabase.createClient(URL,KEY);let user,me;
const el=id=>document.getElementById(id);
function message(t,c=""){ el("msg").innerHTML=t?`<div class="${c}">${t}</div>`:""}
function showAuth(){document.getElementById("auth").classList.remove("hidden")}
function hideAuth(){document.getElementById("auth").classList.add("hidden")}
async function login(){let r=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(r.error)return message(r.error.message,"err");hideAuth();boot()}
async function signup(){let n=document.getElementById("managerName").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("password").value;if(!n||!e||p.length<6)return message("Inserisci nome, email e password (minimo 6 caratteri).","err");let r=await db.auth.signUp({email:e,password:p,options:{data:{manager_name:n}}});if(r.error)return message(r.error.message,"err");message("Registrazione effettuata. Ora puoi accedere.","ok")}
async function boot(){let s=await db.auth.getSession();user=s.data.session?.user;if(!user)return;let r=await db.from("managers").select("*").eq("email",user.email).maybeSingle();me=r.data;if(!me){message("Account non ancora associato al fantallenatore. Registrati con il nome assegnato.","err");return} el("who").textContent=me.name+(me.is_admin?" · ADMIN":"");el("authBtn").innerHTML='<button class="secondary" onclick="logout()">Esci</button>';el("app").classList.remove("hidden");nav();home()}
async function logout(){await db.auth.signOut();location.reload()}
function nav(){let a=[["home","Dashboard"],["players","Listone"],["roster","Rosa"],["lineup","Formazione"],["trades","Scambi"],["standings","Classifica"]];if(me.is_admin)a.push(["admin","Admin"]);el("nav").innerHTML=a.map(x=>`<button onclick="${x[0]}()">${x[1]}</button>`).join("")}
async function home(){let r=await db.from("fantasy_scores").select("final_score").eq("manager_id",me.id),tot=(r.data||[]).reduce((s,x)=>s+Number(x.final_score||0),0);el("content").innerHTML=`<div class="grid"><div class="card"><h2>${me.name}</h2><b>Squadra: ${me.name==="Zillo"?"Zillovic":me.name}</b><p>${me.credits} crediti</p></div><div class="card"><h2>Punti fantasy</h2><b style="font-size:28px">${tot.toFixed(1)}</b></div></div><div class="card"><h2>Benvenuto</h2><p class="muted">FantaBasket Orzi: listone, rose, formazioni, scambi, punteggi e classifica.</p></div>`}
async function players(){let r=await db.from("players").select("id,name,position,is_foreign,real_teams(name)").order("name");el("content").innerHTML=`<div class="card"><h2>Listone · ${(r.data||[]).length} giocatori</h2><input id="q" placeholder="Cerca..." oninput="filter()"><div id="pt"></div></div>`;window.pc=r.data||[];render(pc)}
function render(a){el("pt").innerHTML=`<table><tr><th>Giocatore</th><th>Ruolo</th><th>Squadra</th><th>Str.</th></tr>${a.map(p=>`<tr><td>${p.name}</td><td>${p.position||"Da definire"}</td><td>${p.real_teams?.name||""}</td><td>${p.is_foreign?"Sì":""}</td></tr>`).join("")}</table>`}
function filter(){let q=el("q").value.toLowerCase();render(pc.filter(p=>(p.name+" "+(p.real_teams?.name||"")).toLowerCase().includes(q)))}
async function roster(){let r=await db.from("rosters").select("purchase_price,players(name,position,is_foreign,real_teams(name))").eq("manager_id",me.id).eq("active",true);el("content").innerHTML=`<div class="card"><h2>Rosa</h2><p>${(r.data||[]).length}/11 giocatori</p>${(r.data||[]).map(x=>`<p>${x.players.name} · ${x.players.position} · ${x.players.real_teams?.name||""}${x.players.is_foreign?" · STRANIERO":""}</p>`).join("")||"<p class='muted'>Rosa non ancora caricata.</p>"}</div>`}
async function lineup(){let m=await db.from("matchdays").select("*").order("number"),r=await db.from("rosters").select("player_id,players(name,position)").eq("manager_id",me.id).eq("active",true);el("content").innerHTML=`<div class="card"><h2>Formazione</h2><select id="day">${(m.data||[]).map(x=>`<option value="${x.id}">${x.number}</option>`).join("")}</select><div id="lp">${(r.data||[]).map(x=>`<p>${x.players.name} (${x.players.position}) <select data-p="${x.player_id}"><option value="out">Fuori</option><option value="starter">Titolare</option><option value="sixth">Sesto uomo</option><option value="bench">Panchina 50%</option></select></p>`).join("")}</div><button onclick="saveLineup()">Salva</button><p class="muted">Regola: 2G+2A+1C titolari, sesto uomo 100%, 3 panchinari 50%, 2 fuori, un capitano. Blocco 2 ore prima.</p></div>`}
async function saveLineup(){let day=el("day").value;if(!day)return;let old=await db.from("lineups").select("id").eq("manager_id",me.id).eq("matchday_id",day).maybeSingle(),lid=old.data?.id;if(!lid){let x=await db.from("lineups").insert({manager_id:me.id,matchday_id:day}).select("id").single();if(x.error)return message(x.error.message,"err");lid=x.data.id}await db.from("lineup_players").delete().eq("lineup_id",lid);let vals=[...document.querySelectorAll("#lp select")].map(s=>({lineup_id:lid,player_id:s.dataset.p,role:s.value,captain:false}));let x=await db.from("lineup_players").insert(vals);if(x.error)return message(x.error.message,"err");message("Formazione salvata.","ok")}
async function trades(){let r=await db.from("trades").select("*,proposer:proposer_id(name),receiver:receiver_id(name)").or(`proposer_id.eq.${me.id},receiver_id.eq.${me.id}`).order("created_at",{ascending:false}),m=await db.from("managers").select("id,name").neq("id",me.id);el("content").innerHTML=`<div class="grid"><div class="card"><h2>Nuova proposta</h2><select id="tr">${(m.data||[]).map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}</select><button onclick="trade()">Invia proposta</button><p class="muted">Gli scambi sono illimitati durante il campionato.</p></div><div class="card"><h2>Proposte</h2>${(r.data||[]).map(x=>`<p>${x.proposer.name} → ${x.receiver.name} · <b>${x.status}</b>${x.receiver_id===me.id&&x.status==="pending"?` <button onclick="accept('${x.id}')">Accetta</button>`:""}</p>`).join("")||"Nessuna proposta."}</div></div>`}
async function trade(){let x=await db.from("trades").insert({proposer_id:me.id,receiver_id:el("tr").value,message:"Proposta di scambio"});if(x.error)return message(x.error.message,"err");trades()}
async function accept(id){let x=await db.from("trades").update({status:"accepted",responded_at:new Date().toISOString()}).eq("id",id);if(x.error)return message(x.error.message,"err");trades()}
async function standings(){let r=await db.from("league_matches").select("*,home:home_manager_id(name),away:away_manager_id(name)"),a={};(r.data||[]).forEach(x=>{a[x.home_manager_id]??={n:x.home.name,p:0};a[x.away_manager_id]??={n:x.away.name,p:0};a[x.home_manager_id].p+=x.home_points;a[x.away_manager_id].p+=x.away_points});let rows=Object.values(a).sort((x,y)=>y.p-x.p);el("content").innerHTML=`<div class="card"><h2>Classifica</h2><table><tr><th>#</th><th>Fantallenatore</th><th>Punti</th></tr>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.p}</td></tr>`).join("")}</table><p class="muted">Spareggi: scontri diretti → punteggi nelle singole giornate → punteggi negli scontri diretti.</p></div>`}
async function admin(){if(!me.is_admin)return;let m=await db.from("managers").select("*").order("name");el("content").innerHTML=`<div class="card"><h2>Admin</h2>${(m.data||[]).map(x=>`<p>${x.name} ${x.is_admin?"⭐":""} · ${x.credits} crediti · ${x.email||"email non collegata"}</p>`).join("")}</div><div class="card"><h2>Regole punteggio</h2><p>+1 punto · +1,25 RD · +1,50 RO · +1,50 assist · +1,50 recupero · −1,50 persa · +1,50 stoppata · −0,50 stoppata subita · −1 tiro dal campo sbagliato · −1 libero sbagliato · DD +5 · TD +10 · vittoria +3 · capitano ×1,5.</p></div>`}
boot();
</script></body></html>
