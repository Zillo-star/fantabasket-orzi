</style></head><body>
<header><div><b>🏀 FantaBasket Orzi</b><div id="who" class="muted">Non autenticato</div></div><div id="authBtn"><button onclick="showAuth()">Accedi</button></div></header>
<main><div id="msg"></div>
<section id="auth" class="card hidden">

  <h2>Accedi</h2>

  <label>Email</label>
  <input
    id="email"
    type="email"
    name="email"
    autocomplete="username"
  >

  <label>Password</label>
  <input
    id="password"
    type="password"
    name="password"
    autocomplete="current-password"
  >

  <label>Nome fantallenatore (solo alla registrazione)</label>
  <input
    id="managerName"
    placeholder="Zillo / Picco / Mino / Albi / Pevez / Bedo / Ventu / Dello / Tommi"
  >

  <button onclick="login()">Accedi</button>
  <button class="secondary" onclick="forgotPassword()">
  Password dimenticata?
</button>
  <button class="secondary" onclick="signup()">Registrati</button>
  <button class="secondary" onclick="hideAuth()">Chiudi</button>

</section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section>
</main>
<script>
const SUPABASE_URL="https://ejzipstmvofhjsqrzvfs.supabase.co";
const SUPABASE_KEY="sb_publishable_nNqB08asItxVhY0WAeGXKQ_fKGRC5va";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});
const el=id=>document.getElementById(id);

function showAuth(){
  document.getElementById("auth").classList.remove("hidden");
}
function showPasswordReset(){

  el("auth").classList.add("hidden");

  el("content").innerHTML=`

    <div class="card">

      <h2>🔐 Nuova password</h2>

      <p class="muted">
        Inserisci la nuova password per il tuo account.
      </p>

      <label>Nuova password</label>

      <input
        id="newPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Nuova password"
      >

      <label>Ripeti password</label>

      <input
        id="newPassword2"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Ripeti password"
      >

      <button onclick="updatePassword()">
        Salva nuova password
      </button>

    </div>

  `;

  el("app").classList.remove("hidden");

}

async function updatePassword(){

  let p1=el("newPassword")?.value || "";
  let p2=el("newPassword2")?.value || "";

  if(p1.length<6)
    return message(
      "La password deve avere almeno 6 caratteri.",
      "err"
    );

  if(p1!==p2)
    return message(
      "Le due password non coincidono.",
      "err"
    );

  let r=await db.auth.updateUser({
    password:p1
  });

  if(r.error)
    return message(
      "Errore cambio password: "+r.error.message,
      "err"
    );

  message(
    "✅ Password aggiornata correttamente. Ora puoi accedere con la nuova password.",
    "ok"
  );

  setTimeout(()=>{
    location.href=window.location.origin+window.location.pathname;
  },1200);

}
function hideAuth(){
  document.getElementById("auth").classList.add("hidden");
}

function message(t,c=""){
  document.getElementById("msg").innerHTML=
    t?`<div class="${c}">${t}</div>`:"";
}
async function login(){let r=await db.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(r.error)return message(r.error.message,"err");hideAuth();boot()}
async function forgotPassword(){

  let email=el("email").value.trim();

  if(!email)
    return message(
      "Inserisci prima la tua email.",
      "err"
    );

  let redirectTo=window.location.origin+window.location.pathname;

  let r=await db.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:redirectTo
    }
  );

  if(r.error)
    return message(
      "Errore invio email: "+r.error.message,
      "err"
    );

  message(
    "Email inviata. Controlla la posta e apri il link per impostare la nuova password.",
    "ok"
  );

}
async function signup(){let n=document.getElementById("managerName").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("password").value;if(!n||!e||p.length<6)return message("Inserisci nome, email e password (minimo 6 caratteri).","err");let r=await db.auth.signUp({email:e,password:p,options:{data:{manager_name:n}}});if(r.error)return message(r.error.message,"err");message("Registrazione effettuata. Ora puoi accedere.","ok")}
async function boot(){

  let s=await db.auth.getSession();

  user=s.data.session?.user;

  if(!user)
    return;

  let r=await db
    .from("managers")
    .select("*")
    .eq("email",user.email)
    .maybeSingle();

  if(r.error)
    return message(
      r.error.message,
      "err"
    );

  me=r.data;

  if(!me){

    message(
      "Account non ancora associato al fantallenatore. Registrati con il nome assegnato.",
      "err"
    );

    return;

  }

  el("who").innerHTML=`

    <b>${me.team_name || me.name}</b>

    <div class="muted" style="font-size:12px">
      ${me.name}${me.is_admin?" · ADMIN":""}
    </div>

  `;

  el("authBtn").innerHTML=
    '<button class="secondary" onclick="logout()">Esci</button>';

  el("app").classList.remove("hidden");

  nav();

  home();

}
async function logout(){await db.auth.signOut();location.reload()}
function nav(){

  let a=[
    ["home","Dashboard"],
    ["players","Listone"],
    ["roster","Rose"],
    ["lineup","Formazione"],
    ["trades","Scambi"],
    ["calendar","Calendario"],
    ["standings","Classifica"]
  ];

  if(me.is_admin)
    a.push(["admin","Admin"]);


  el("nav").innerHTML=

    a.map(x=>`
      <button onclick="${x[0]}()">
        ${x[1]}
      </button>
    `).join("")

    +

    `
      <button
        onclick="showNotifications()"
        id="notificationBtn"
        style="
          position:relative;
          white-space:nowrap;
        "
      >
        🔔
        <span
          id="notificationBadge"
          style="
            display:none;
            position:absolute;
            top:2px;
            right:2px;
            min-width:17px;
            height:17px;
            padding:0 4px;
            border-radius:999px;
            background:#ef4444;
            color:white;
            font-size:10px;
            font-weight:bold;
            line-height:17px;
            text-align:center;
          "
        >
          0
        </span>
      </button>
    `;

  loadNotificationCount();

}
async function loadNotificationCount(){

  if(!me?.id)
    return;


  let r=await db
    .from("notifications")
    .select("id", {count:"exact", head:true})
    .eq("manager_id",me.id)
    .eq("read",false);


  if(r.error){
    console.error(
      "Errore notifiche:",
      r.error
    );
    return;
  }


  let badge=
    el("notificationBadge");

  if(!badge)
    return;


  let count=r.count||0;


  if(count>0){

    badge.style.display="block";

    badge.textContent=
      count>99
        ? "99+"
        : count;

  }else{

    badge.style.display="none";

  }

}
async function showNotifications(){
if(window.notificationInterval){
clearInterval(window.notificationInterval);
window.notificationInterval=null;
}

  let r=await db
    .from("notifications")
    .select("*")
    .eq("manager_id",me.id)
    .order("created_at",{ascending:false})
    .limit(30);


  if(r.error)
    return message(
      r.error.message,
      "err"
    );


  let notifications=
    r.data||[];


  el("content").innerHTML=`

    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        margin-bottom:18px;
      ">

        <h2 style="margin:0">
          🔔 Notifiche
        </h2>

        ${
          notifications.some(x=>!x.read)
          ? `
            <button
              onclick="markAllNotificationsRead()"
            >
              Segna tutte come lette
            </button>
          `
          : ""
        }

      </div>


      ${
        notifications.length===0

        ? `
          <div class="muted">
            Nessuna notifica.
          </div>
        `

        :

        notifications.map(x=>`

          <div
            onclick="markNotificationRead('${x.id}')"
            style="
              padding:14px;
              margin-bottom:10px;
              border-radius:12px;
              background:${x.read ? "rgba(255,255,255,.03)" : "rgba(59,130,246,.10)"};
              border:1px solid ${x.read ? "rgba(255,255,255,.06)" : "rgba(59,130,246,.25)"};
              cursor:pointer;
            "
          >

            <div style="
              display:flex;
              justify-content:space-between;
              align-items:flex-start;
              gap:10px;
            ">

              <div>

                <b>
                  ${x.title}
                </b>

                <div
                  class="muted"
                  style="
                    margin-top:5px;
                    line-height:1.4;
                  "
                >
                  ${x.message}
                </div>

              </div>


              ${
                !x.read

function formatNotificationDate(date){

  if(!date)
    return "";

  let d=new Date(date);

  return d.toLocaleString(
    "it-IT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

async function updateDashboardNotification(){

  if(!me?.id)
    return;


  let r=await db
    .from("notifications")
    .select(
      "id",
      {count:"exact",head:true}
    )
    .eq("manager_id",me.id)
    .eq("read",false);


  if(r.error){
    console.error(
      "Errore notifiche:",
      r.error
    );
    return;
  }


  let badge=
    el("dashboardNotificationBadge");


  if(!badge)
    return;


  let count=
    r.count||0;


  if(count>0){

    badge.style.display="block";

    badge.textContent=
      count>99
        ? "99+"
        : count;

  }else{

    badge.style.display="none";

  }

}

async function saveTeamName(){

  let input=el("teamNameInput");

  if(!input)
    return message(
      "Campo nome squadra non trovato.",
      "err"
    );

  let name=input.value.trim();

  if(!name)
    return message(
      "Inserisci un nome per la squadra.",
      "err"
    );

  if(name.length>30)
    return message(
      "Il nome può avere massimo 30 caratteri.",
      "err"
    );

  let r=await db
    .from("managers")
    .update({
      team_name:name
    })
    .eq("id",me.id);

  if(r.error){

    console.error(
      "Errore salvataggio nome squadra:",
      r.error
    );

    return message(
      "Errore nel salvataggio: "+r.error.message,
      "err"
    );

  }

  /*
    Ricarichiamo il profilo dal database.
    Così siamo sicuri che il nome sia realmente
    quello salvato.
  */

  let fresh=await db
    .from("managers")
    .select("*")
    .eq("id",me.id)
    .maybeSingle();

  if(fresh.error)
    return message(
      fresh.error.message,
      "err"
    );

  if(fresh.data)
    me=fresh.data;

  message(
    "Nome squadra aggiornato!",
    "ok"
  );

  setTimeout(()=>{
    home();
  },500);

}

    .order("name");

    .from("rosters")
    .select("player_id,manager_id")
    .eq("active",true);

  if(rosterResult.error)
    return message(rosterResult.error.message,"err");


  /*
    Recupera i fantallenatori proprietari.
  */

  let managerIds=[
    ...new Set(
      (rosterResult.data||[])
        .map(x=>x.manager_id)
        .filter(Boolean)
    )
  ];

  let managersResult={
    data:[],
    error:null
  };

  if(managerIds.length){

    managersResult=await db
      .from("managers")
      .select("id,name,team_name")
      .in("id",managerIds);

    if(managersResult.error)
      return message(
        managersResult.error.message,
        "err"
      );

  }


  /*
    Crea una mappa:
    player_id -> fantallenatore proprietario
  */

  let managersMap={};

  (managersResult.data||[]).forEach(m=>{
    managersMap[m.id]=m;
  });

  let ownershipMap={};

  (rosterResult.data||[]).forEach(x=>{

    let manager=managersMap[x.manager_id];

      managerId:x.manager_id,

  el("content").innerHTML=`

      <input
        id="q"

        <option value="">Tutti i ruoli</option>

function filterPlayers(){

  let q=
    (el("q")?.value||"")
      .toLowerCase()
      .trim();

  let status=
    el("statusFilter")?.value||"";

  let role=
    el("roleFilter")?.value||"";

  let team=
    el("teamFilter")?.value||"";

  let foreign=
    el("foreignFilter")?.value||"";


  let filtered=
    window.pc.filter(p=>{

      let name=
        (p.name||"")
          .toLowerCase();

      let teamName=
        (p.real_teams?.name||"")
          .toLowerCase();


      /*
        Cerca giocatore / squadra
      */

      if(
        q &&
        !name.includes(q) &&
        !teamName.includes(q)
      )
        return false;


      /*
        Stato
      */

      if(
        status &&
        p.status!==status
      )
        return false;


      /*
        Ruolo
      */

      if(
        role &&
        p.position!==role
      )
        return false;


      /*
        Squadra reale
      */

      if(
        team &&
        String(p.real_teams?.id)!==String(team)
      )
        return false;


      /*
        Straniero
      */

      if(
        foreign==="yes" &&
        !p.is_foreign
      )
        return false;


      if(
        foreign==="no" &&
        p.is_foreign
      )
        return false;


      return true;

    });


  renderPlayers(filtered);

}

 if(isCurrentDay){

    if(deadline)
      updateLineupLock(new Date(deadline));

  }else{

    updateLineupLock(null);

  }
}


/*
  Aggiorna deadline e countdown.
*/

function updateLineupDeadline(){

  let select=el("day");

  if(!select)
    return;

  let selected=select.options[select.selectedIndex];

  if(!selected)
    return;

  let matchdayNumber=
    Number(selected.dataset.number);

  let deadlineString=
    window.lineupDeadlines?.[matchdayNumber];

  let deadlineText=
    el("deadlineText");

  if(!deadlineString){

    if(deadlineText)
      deadlineText.textContent="—";

    let countdown=el("countdown");

    if(countdown)
      countdown.textContent="";

    return;

  }

  let deadline=new Date(deadlineString);

  if(isNaN(deadline.getTime())){

    if(deadlineText)
      deadlineText.textContent="Deadline non valida";

    return;

  }

  if(deadlineText){

    deadlineText.textContent=
      deadline.toLocaleString("it-IT",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      });

  }

  updateLineupLock(deadline);

  if(window.lineupCountdownInterval)
    clearInterval(window.lineupCountdownInterval);

  window.lineupCountdownInterval=
    setInterval(()=>{

      let currentSelect=el("day");

      if(!currentSelect)
        return;

      let currentOption=
        currentSelect.options[currentSelect.selectedIndex];

      if(!currentOption)
        return;

      let currentNumber=
        Number(currentOption.dataset.number);

      let currentDeadline=
        window.lineupDeadlines?.[currentNumber];

      if(!currentDeadline)
        return;

      updateLineupLock(
        new Date(currentDeadline)
      );

    },1000);

}


/*
  Blocca/sblocca la formazione.
*/

function updateLineupLock(deadline){

  let now=new Date();

  let isFutureDay=
    window.currentLineupDay!==undefined &&
    Number(
      el("day")?.options[
        el("day")?.selectedIndex
      ]?.dataset.number
    )>Number(window.currentLineupDay);

  let locked=
    isFutureDay ||
    !deadline ||
    now>=deadline;

  let countdown=el("countdown");
  let button=el("saveLineupBtn");

  if(!countdown)
    return;

  if(isFutureDay){

    countdown.textContent="🔒 Giornata non ancora disponibile";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Giornata bloccata";

    }

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "Puoi impostare la formazione solo per la giornata attuale.";

    return;

  }

  if(!deadline){

    countdown.textContent="🔒 Formazione chiusa";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Formazione chiusa";

    }

    return;

  }

  if(locked){

    countdown.textContent="🔒 Formazione chiusa";

    document.querySelectorAll("#lp select")
      .forEach(x=>{
        x.disabled=true;
      });

    document.querySelectorAll(
      "#lp input[data-captain]"
    ).forEach(x=>{
      x.disabled=true;
    });

    if(button){

      button.disabled=true;
      button.textContent="Formazione chiusa";

    }

    let status=el("lineupStatus");

    if(status)
      status.textContent=
        "La deadline è scaduta. Non puoi più modificare la formazione.";

    return;

  }

  let diff=deadline-now;

  let totalSeconds=
    Math.floor(diff/1000);

  let days=
    Math.floor(totalSeconds/86400);

  let hours=
    Math.floor(
      (totalSeconds%86400)/3600
    );

  let minutes=
    Math.floor(
      (totalSeconds%3600)/60
    );

  let seconds=
    totalSeconds%60;

  countdown.textContent=
    "⏱️ Mancano "+
    (days?days+"g ":"")+
    String(hours).padStart(2,"0")+":"+
    String(minutes).padStart(2,"0")+":"+
    String(seconds).padStart(2,"0");

  document.querySelectorAll("#lp select")
    .forEach(x=>{
      x.disabled=false;
    });

  document.querySelectorAll(
    "#lp input[data-captain]"
  ).forEach(x=>{
    x.disabled=false;
  });

  if(button){

    button.disabled=false;
    button.textContent="Salva formazione";

  }

  let status=el("lineupStatus");

  if(status)
    status.textContent="Formazione modificabile.";

}

async function saveLineup(){

  let select=el("day");

  if(!select)
    return message(
      "Seleziona una giornata.",
      "err"
    );

  let selected=
    select.options[select.selectedIndex];

  if(!selected)
    return message(
      "Seleziona una giornata.",
      "err"
    );

let matchdayId=selected.value;

let matchdayNumber=
  Number(selected.dataset.number);

console.log("SAVE MATCHDAY ID:",matchdayId);
console.log(
  "SAVE MATCHDAY NUMBER:",
  matchdayNumber
);

/*
  Le giornate future non possono mai essere modificate.
*/

if(
  window.currentLineupDay!==undefined &&
  matchdayNumber>Number(window.currentLineupDay)
){

  return message(
    "Questa giornata non è ancora disponibile. Devi aspettare la conclusione della giornata attuale.",
    "err"
  );

}

/*
  La giornata deve avere l'UUID.
*/

if(!matchdayId)
  return message(
    "ID giornata non valido.",
    "err"
  );

  let deadline=
    window.lineupDeadlines?.[matchdayNumber];

  if(!deadline)
    return message(
      "Deadline non disponibile per questa giornata.",
      "err"
    );

  if(new Date()>=new Date(deadline))
    return message(
      "La deadline per questa giornata è scaduta. La formazione non può più essere modificata.",
      "err"
    );

  let selects=[
    ...document.querySelectorAll(
      "#lp select[data-p]"
    )
  ];

  if(selects.length!==13)
    return message(
      "La rosa deve avere 13 giocatori.",
      "err"
    );

  let starters=
    selects.filter(
      s=>s.value==="starter"
    );

  let sixth=
    selects.filter(
      s=>s.value==="sixth"
    );

  let bench=
    selects.filter(
      s=>s.value==="bench"
    );

  let out=
    selects.filter(
      s=>s.value==="out"
    );

  if(starters.length!==5)
    return message(
      "Devi avere 5 titolari.",
      "err"
    );

  if(sixth.length!==1)
    return message(
      "Devi avere 1 sesto uomo.",
      "err"
    );

  if(bench.length!==4)
    return message(
      "Devi avere 4 panchinari.",
      "err"
    );

  if(out.length!==3)
    return message(
      "Devi avere 3 giocatori fuori.",
      "err"
    );

  let g=
    starters.filter(
      s=>s.dataset.pos==="G"
    ).length;

  let a=
    starters.filter(
      s=>s.dataset.pos==="A"
    ).length;

  let c=
    starters.filter(
      s=>s.dataset.pos==="C"
    ).length;

let moduloValido=
  (g===2&&a===2&&c===1) ||
  (g===1&&a===3&&c===1) ||
  (g===1&&a===2&&c===2) ||
  (g===2&&a===1&&c===2) ||
  (g===3&&a===1&&c===1);

if(!moduloValido)
  return message(
    "Modulo non valido. Moduli consentiti: 2G-2A-1C, 1G-3A-1C, 1G-2A-2C, 2G-1A-2C, 3G-1A-1C.",
    "err"
  );

  let captains=[
    ...document.querySelectorAll(
      'input[data-captain]:checked'
    )
  ];

  if(captains.length!==1)
    return message(
      "Devi scegliere un capitano.",
      "err"
    );

  let captainId=
    captains[0].dataset.captain;

  /*
    Cerca la formazione esistente.
  */

  let old=await db.from("lineups")
    .select("id")
    .eq("manager_id",me.id)
    .eq("matchday_id",matchdayId)
    .maybeSingle();

  if(old.error)
    return message(
      old.error.message,
      "err"
    );

  let lid=old.data?.id;

  /*
    Se non esiste, la crea.
  */

  if(!lid){

    let x=await db.from("lineups")
      .insert({
        manager_id:me.id,
        matchday_id:matchdayId
      })
      .select("id")
      .single();

    if(x.error)
      return message(
        x.error.message,
        "err"
      );

    lid=x.data.id;

  }

  /*
    Cancella i giocatori precedenti.
  */

  let d=await db.from("lineup_players")
    .delete()
    .eq("lineup_id",lid);

  if(d.error)
    return message(
      d.error.message,
      "err"
    );

  /*
    Inserisce la formazione aggiornata.
  */

  let vals=selects.map(s=>({

    lineup_id:lid,
    player_id:s.dataset.p,
    role:s.value,
    captain:s.dataset.p===captainId

  }));

  let x=await db.from("lineup_players")
    .insert(vals);

  if(x.error)
    return message(
      x.error.message,
      "err"
    );

  message(
    "Formazione salvata correttamente.",
    "ok"
  );

  /*
    Ricarica la formazione dal database,
    così la schermata rappresenta
    esattamente ciò che è stato salvato.
  */

  await loadSavedLineup();

}

async function checkTradeRoles(){

  let offered=
    [...document.querySelectorAll(".tradeOfferedSelect")]
      .map(x=>x.value)
      .filter(Boolean);

  let requested=
    [...document.querySelectorAll(".tradeRequestedSelect")]
      .map(x=>x.value)
      .filter(Boolean);

  let box=el("tradeRoleCheck");

  if(!box)
    return;

  if(
    offered.length===0 &&
    requested.length===0
  ){

    box.innerHTML=
      "Seleziona i giocatori.";

    return;
  }

  /*
   * STESSO NUMERO DI GIOCATORI
   */

  if(offered.length!==requested.length){

    box.innerHTML=`
      ⚠️ Devi selezionare lo stesso numero
      di giocatori da entrambe le parti.
    `;

    return;
  }

  /*
   * NESSUN DUPLICATO
   */

  if(
    new Set(offered).size!==offered.length ||
    new Set(requested).size!==requested.length
  ){

    box.innerHTML=`
      ❌ Non puoi selezionare due volte
      lo stesso giocatore.
    `;

    return;
  }

  /*
   * RECUPERA I GIOCATORI DELLO SCAMBIO
   */

  let allIds=[
    ...offered,
    ...requested
  ];

  let p=await db
    .from("players")
    .select(`
      id,
      name,
      surname,
      position,
      is_foreign,
      real_team_id,
      real_teams(name)
    `)
    .in("id",allIds);

  if(p.error){

    box.innerHTML=
      "Errore nel controllo dello scambio.";

    return;
  }

  let playerMap=
    new Map(
      (p.data||[]).map(x=>[
        x.id,
        x
      ])
    );

  /*
   * CONTROLLA RUOLI
   */

  let offeredRoles=
    offered
      .map(id=>playerMap.get(id)?.position)
      .sort()
      .join("|");

  let requestedRoles=
    requested
      .map(id=>playerMap.get(id)?.position)
      .sort()
      .join("|");

  if(offeredRoles!==requestedRoles){

    box.innerHTML=`
      ❌ <b>Scambio non valido.</b><br>
      I ruoli devono essere uguali da entrambe le parti.
    `;

    return;
  }

  /*
   * RECUPERA LA ROSA DEL PROPONENTE
   */

  let mine=await db
    .from("rosters")
    .select(`
      player_id,
      players(
        id,
        name,
        surname,
        position,
        is_foreign,
        real_team_id,
        real_teams(name)
      )
    `)
    .eq("manager_id",me.id)
    .eq("active",true);

  if(mine.error){

    box.innerHTML=
      "Errore nel controllo della tua rosa.";

    return;
  }

  /*
   * RECUPERA LA ROSA DEL DESTINATARIO
   */

  let receiverId=
    el("tradeReceiver")?.value;

  if(!receiverId){

    box.innerHTML=
      "Seleziona prima il fantallenatore.";

    return;
  }

  let theirs=await db
    .from("rosters")
    .select(`
      player_id,
      players(
        id,
        name,
        surname,
        position,
        is_foreign,
        real_team_id,
        real_teams(name)
      )
    `)
    .eq("manager_id",receiverId)
    .eq("active",true);

  if(theirs.error){

    box.innerHTML=
      "Errore nel controllo della rosa dell'altro fantallenatore.";

    return;
  }

  /*
   * CREA LE ROSE DOPO LO SCAMBIO
   */

  let myAfter=
    (mine.data||[])
      .map(x=>x.players)
      .filter(Boolean)
      .filter(
        p=>!offered.includes(p.id)
      )
      .concat(
        requested
          .map(id=>playerMap.get(id))
          .filter(Boolean)
      );

  let theirAfter=
    (theirs.data||[])
      .map(x=>x.players)
      .filter(Boolean)
      .filter(
        p=>!requested.includes(p.id)
      )
      .concat(
        offered
          .map(id=>playerMap.get(id))
          .filter(Boolean)
      );

  /*
   * FUNZIONE CONTROLLO ROSA
   */

  function validateRoster(players){

    /*
     * STRANIERI
     */

    let foreigners=
      players.filter(
        p=>p.is_foreign===true
      ).length;

    if(foreigners>1){

      return {
        ok:false,
        message:
          "avrebbe più di 1 straniero"
      };

    }

    /*
     * MASSIMO 2 DELLA STESSA SQUADRA
     */

    let teams={};

    for(let p of players){

      if(!p.real_team_id)
        continue;

      teams[p.real_team_id]=
        (teams[p.real_team_id]||0)+1;

      if(teams[p.real_team_id]>2){

        return {
          ok:false,
          message:
            "avrebbe più di 2 giocatori della stessa squadra"
        };

      }

    }

    return {
      ok:true
    };

  }

  /*
   * CONTROLLO TUA ROSA
   */

  let myCheck=
    validateRoster(myAfter);

  if(!myCheck.ok){

    box.innerHTML=`
      ❌ <b>Scambio non valido per la tua rosa.</b><br>
      ${myCheck.message}.
    `;

    return;
  }

  /*
   * CONTROLLO ROSA AVVERSARIA
   */

  let theirCheck=
    validateRoster(theirAfter);

  if(!theirCheck.ok){

    box.innerHTML=`
      ❌ <b>Scambio non valido per la rosa dell'altro fantallenatore.</b><br>
      ${theirCheck.message}.
    `;

    return;
  }

  /*
   * TUTTO OK
   */

  box.innerHTML=`
    ✅ <b>Composizione valida.</b><br>
    ${offered
      .map(id=>playerMap.get(id)?.position)
      .join(" + ")}
    ↔
    ${requested
      .map(id=>playerMap.get(id)?.position)
      .join(" + ")}
    <br>
    <span class="muted">
      Nessun vincolo di stranieri o squadra violato.
    </span>
  `;

}

  if(offeredIds.length!==requestedIds.length)
    return message(
      "Devi selezionare lo stesso numero di giocatori da entrambe le parti.",
      "err"
    );

  if(offeredIds.length>3)
    return message(
      "Puoi scambiare al massimo 3 giocatori per parte.",
      "err"
    );

  if(
    new Set(offeredIds).size!==offeredIds.length ||
    new Set(requestedIds).size!==requestedIds.length
  )
    return message(
      "Non puoi selezionare due volte lo stesso giocatore.",
      "err"
    );

  /*
   * RECUPERA TUTTI I GIOCATORI COINVOLTI
   */

  let allIds=[
    ...offeredIds,
    ...requestedIds
  ];

  let players=await db
    .from("players")
    .select(`
      id,
      name,
      surname,
      position,
      is_foreign,
      real_team_id,
      real_teams(name)
    `)
    .in("id",allIds);

  if(players.error)
    return message(
      players.error.message,
      "err"
    );

  let playerMap=
    new Map(
      (players.data||[]).map(x=>[
        x.id,
        x
      ])
    );

  /*
   * CONTROLLA CHE TUTTI I GIOCATORI ESISTANO
   */

  if(
    allIds.some(
      id=>!playerMap.has(id)
    )
  )
    return message(
      "Uno dei giocatori selezionati non esiste più.",
      "err"
    );

  /*
   * CONTROLLA I RUOLI
   */

  let offeredRoles=
    offeredIds
      .map(id=>playerMap.get(id).position)
      .sort()
      .join("|");

  let requestedRoles=
    requestedIds
      .map(id=>playerMap.get(id).position)
      .sort()
      .join("|");

  if(offeredRoles!==requestedRoles)
    return message(
      "Lo scambio deve avere la stessa composizione di ruoli.",
      "err"
    );

  /*
   * RECUPERA LE ROSE ATTUALI
   */

  let mine=await db
    .from("rosters")
    .select(`
      player_id,
      players(
        id,
        name,
        surname,
        position,
        is_foreign,
        real_team_id
      )
    `)
    .eq("manager_id",me.id)
    .eq("active",true);

  if(mine.error)
    return message(
      mine.error.message,
      "err"
    );

  let theirs=await db
    .from("rosters")
    .select(`
      player_id,
      players(
        id,
        name,
        surname,
        position,
        is_foreign,
        real_team_id
      )
    `)
    .eq("manager_id",receiverId)
    .eq("active",true);

  if(theirs.error)
    return message(
      theirs.error.message,
      "err"
    );

  /*
   * CONTROLLA CHE I GIOCATORI
   * SIANO DAVVERO NELLE RISPETTIVE ROSE
   */

  let myIds=
    (mine.data||[])
      .map(x=>x.player_id);

  let theirIds=
    (theirs.data||[])
      .map(x=>x.player_id);

  if(
    offeredIds.some(
      id=>!myIds.includes(id)
    )
  )
    return message(
      "Puoi offrire solo giocatori presenti nella tua rosa.",
      "err"
    );

  if(
    requestedIds.some(
      id=>!theirIds.includes(id)
    )
  )
    return message(
      "Puoi richiedere solo giocatori presenti nella rosa dell'altro fantallenatore.",
      "err"
    );

  /*
   * CREA LE ROSE RISULTANTI
   */

  let myAfter=
    (mine.data||[])
      .map(x=>x.players)
      .filter(Boolean)
      .filter(
        p=>!offeredIds.includes(p.id)
      )
      .concat(
        requestedIds
          .map(id=>playerMap.get(id))
      );

  let theirAfter=
    (theirs.data||[])
      .map(x=>x.players)
      .filter(Boolean)
      .filter(
        p=>!requestedIds.includes(p.id)
      )
      .concat(
        offeredIds
          .map(id=>playerMap.get(id))
      );

  /*
   * FUNZIONE DI CONTROLLO VINCOLI
   */

  function validateRoster(players){

    /*
     * STRANIERI
     */

    let foreigners=
      players.filter(
        p=>p.is_foreign
      ).length;

    if(foreigners>1)
      return "Non puoi avere più di 1 straniero.";

    /*
     * MASSIMO 2 DELLA STESSA SQUADRA
     */

    let teams={};

    for(let p of players){

      if(!p.real_team_id)
        continue;

      teams[p.real_team_id]=
        (teams[p.real_team_id]||0)+1;

      if(teams[p.real_team_id]>2){

        let teamName=
          p.real_teams?.name ||
          "una stessa squadra";

        return(
          "Non puoi avere più di 2 giocatori della stessa squadra ("+
          teamName+
          ")."
        );
      }
    }

    return null;

  }

  let myError=
    validateRoster(myAfter);

  if(myError)
    return message(
      "Scambio non valido per la tua rosa: "+myError,
      "err"
    );

  let theirError=
    validateRoster(theirAfter);

  if(theirError)
    return message(
      "Scambio non valido per la rosa dell'altro fantallenatore: "+theirError,
      "err"
    );

  /*
   * INSERISCE LA PROPOSTA
   */

  let x=await db
    .from("trades")
    .insert({

      proposer_id:me.id,

      receiver_id:receiverId,

      offered_player_ids:offeredIds,

      requested_player_ids:requestedIds,

      /*
       * Compatibilità con gli scambi vecchi 1 ↔ 1
       */

      offered_player_id:
        offeredIds.length===1
          ? offeredIds[0]
          : null,

      requested_player_id:
        requestedIds.length===1
          ? requestedIds[0]
          : null,

      message:"Proposta di scambio",

      status:"pending"

    })
    .select()
    .single();

  if(x.error)
    return message(
      x.error.message,
      "err"
    );

  /*
   * NOTIFICA
   */

  let offeredNames=
    offeredIds
      .map(id=>{
        let p=playerMap.get(id);
        return p
          ? `${p.name} ${p.surname||""}`.trim()
          : "";
      })
      .join(" + ");

  let requestedNames=
    requestedIds
      .map(id=>{
        let p=playerMap.get(id);
        return p
          ? `${p.name} ${p.surname||""}`.trim()
          : "";
      })
      .join(" + ");

  let notification=
    await db
      .from("notifications")
      .insert({

        manager_id:receiverId,

        type:"trade_new",

        title:"🔄 Nuova proposta di scambio",

        message:
          (me.team_name || me.name || "Un fantallenatore")
          +" ti ha proposto uno scambio: "
          +offeredNames
          +" ↔ "
          +requestedNames,

        trade_id:x.data.id

      });

  if(notification.error)
    console.error(
      "Errore notifica:",
      notification.error
    );

  message(
    "✅ Proposta di scambio inviata!"
  );

  trades();

}
async function accept(id){

  let x=await db.rpc(
    "accept_trade",
    {
      p_trade_id:id
    }
  );


  if(x.error)
    return message(
      x.error.message,
      "err"
    );


  message(
    "✅ Scambio accettato! Le rose sono state aggiornate."
  );


  trades();

}
async function reject(id){

  let x=await db.rpc(
    "reject_trade",
    {
      p_trade_id:id
    }
  );


  if(x.error)
    return message(
      x.error.message,
      "err"
    );


  message(
    "❌ Proposta rifiutata."
  );


  trades();

}
async function calendar(){

  let r=await db.from("league_matches")
    .select(`
      id,
      matchday_number,
      home_manager_id,
      away_manager_id,
      home_score,
      away_score,
      completed
    `)
    .order("matchday_number")
    .order("id");

  if(r.error)
    return message(r.error.message,"err");

  let matches=r.data||[];


  let managerIds=[
    ...new Set(
      matches.flatMap(x=>[
        x.home_manager_id,
        x.away_manager_id
      ])
    )
  ];


  let managers={};

  if(managerIds.length){

    let m=await db.from("managers")
      .select(`
        id,
        name,
        team_name
      `)
      .in("id",managerIds);

    if(m.error)
      return message(m.error.message,"err");

    (m.data||[]).forEach(x=>{
      managers[x.id]=x;
    });

  }


  /*
    Recuperiamo tutte le giornate.
  */

  let matchdayNumbers=[
    ...new Set(
      matches.map(x=>x.matchday_number)
    )
  ];


  let md=await db.from("matchdays")
    .select(`
      id,
      number,
      lineup_deadline
    `)
    .in("number",matchdayNumbers);

  if(md.error)
    return message(md.error.message,"err");


  let matchdays={};
  let matchdayIds=[];

  (md.data||[]).forEach(x=>{

    matchdays[x.number]={
      id:x.id,
      number:x.number,
      lineup_deadline:x.lineup_deadline
    };

    matchdayIds.push(x.id);

  });


  /*
    Individuiamo la giornata attuale.

    È la prima giornata che NON è ancora
    completamente conclusa.

    Le giornate precedenti sono archiviate.
  */

  let allDays=[
    ...new Set(
      matches.map(x=>Number(x.matchday_number))
    )
  ].sort((a,b)=>a-b);


  let currentDay=null;


  for(let day of allDays){

    let dayMatches=
      matches.filter(
        x=>Number(x.matchday_number)===day
      );

    let complete=
      dayMatches.length>0 &&
      dayMatches.every(
        x=>x.completed===true
      );

    if(!complete){

      currentDay=day;
      break;

    }

  }


  /*
    Se tutte le giornate sono concluse,
    consideriamo attuale l'ultima.
  */

  if(currentDay===null && allDays.length){

    currentDay=
      allDays[allDays.length-1];

  }


  /*
    Recuperiamo tutte le formazioni delle giornate
    presenti nel calendario.
  */

  let lineups=[];

  if(managerIds.length && matchdayIds.length){

    let l=await db.from("lineups")
      .select(`
        id,
        manager_id,
        matchday_id
      `)
      .in("manager_id",managerIds)
      .in("matchday_id",matchdayIds);

    if(l.error)
      return message(l.error.message,"err");

    lineups=l.data||[];

  }


  /*
    Mappa:
    manager + giornata -> lineup
  */

  let lineupMap={};

  lineups.forEach(l=>{

    lineupMap[
      l.manager_id+"_"+l.matchday_id
    ]=l;

  });


  /*
    Recuperiamo i giocatori presenti nelle formazioni.
  */

  let lineupIds=
    lineups.map(x=>x.id);

  let lineupPlayers=[];

  if(lineupIds.length){

    let lp=await db.from("lineup_players")
      .select(`
        lineup_id,
        player_id,
        role,
        captain
      `)
      .in("lineup_id",lineupIds);

    if(lp.error)
      return message(lp.error.message,"err");

    lineupPlayers=lp.data||[];

  }


  /*
    Recuperiamo i dati dei giocatori.
  */

  let playerIds=[
    ...new Set(
      lineupPlayers.map(
        x=>x.player_id
      )
    )
  ];

  let players={};

  if(playerIds.length){

    let p=await db.from("players")
      .select(`
        id,
        name,
        surname,
        position,
        real_team_id,
        real_teams(
          name,
          logo_url
        )
      `)
      .in("id",playerIds);

    if(p.error)
      return message(p.error.message,"err");

    (p.data||[]).forEach(x=>{
      players[x.id]=x;
    });

  }


  /*
    Recuperiamo i punteggi fantasy.
  */

  let fantasyScores=[];

  if(managerIds.length && matchdayIds.length){

    let fs=await db.from("fantasy_scores")
      .select(`
        manager_id,
        matchday_id,
        player_id,
        final_score
      `)
      .in("manager_id",managerIds)
      .in("matchday_id",matchdayIds);

    if(fs.error)
      return message(fs.error.message,"err");

    fantasyScores=fs.data||[];

  }


  let scoreMap={};

  fantasyScores.forEach(x=>{

    scoreMap[
      x.manager_id+
      "_"+
      x.matchday_id+
      "_"+
      x.player_id
    ]=x.final_score;

  });


  /*
    Costruisce la formazione.

    Prima della deadline:
    NON mostra i giocatori.

    Dopo la deadline:
    mostra la formazione completa.
  */

  function renderLineup(managerId,dayNumber){

    let matchday=
      matchdays[dayNumber];

    if(!matchday)
      return `
        <p class="muted">
          Giornata non trovata.
        </p>
      `;


    let matchdayId=
      matchday.id;


    let lineup=
      lineupMap[
        managerId+"_"+matchdayId
      ];


    /*
      CONTROLLO DEADLINE
    */

    let deadlinePassed=true;

    if(matchday.lineup_deadline){

      deadlinePassed=
        new Date() >=
        new Date(
          matchday.lineup_deadline
        );

    }


    /*
      PRIMA DELLA DEADLINE
    */

    if(!deadlinePassed){

      if(lineup){

        return `
          <div class="muted"
            style="
              padding:10px 0;
              font-weight:600;
            "
          >
            🔒 Formazione schierata, ma non visibile
          </div>
        `;

      }

      return `
        <div class="muted"
          style="
            padding:10px 0;
            font-weight:600;
          "
        >
          ⏳ Formazione non ancora salvata
        </div>
      `;

    }


    /*
      DOPO LA DEADLINE
    */

    if(!lineup){

      return `
        <div class="muted">
          Formazione non ancora salvata
        </div>
      `;

    }


    let lp=
      lineupPlayers.filter(
        x=>x.lineup_id===lineup.id
      );


    if(!lp.length){

      return `
        <div class="muted">
          Formazione vuota.
        </div>
      `;

    }


    let starters=[];
    let sixth=[];
    let bench=[];
    let out=[];


    lp.forEach(x=>{

      let player=
        players[x.player_id];

      if(!player)
        return;


      let item={
        ...x,
        player
      };


      if(x.role==="starter")
        starters.push(item);

      else if(x.role==="sixth")
        sixth.push(item);

      else if(x.role==="bench")
        bench.push(item);

      else
        out.push(item);

    });


    function playerRow(x){

      let teamName=
        x.player.real_teams?.name || "";


      let score=
        scoreMap[
          managerId+
          "_"+
          matchdayId+
          "_"+
          x.player_id
        ];


      let captain=
        x.captain
          ? ` 👑`
          : "";


      let scoreText=
        score!==undefined &&
        score!==null
          ? `<span class="muted">${score}</span>`
          : "";


      return `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:6px 0;
          border-bottom:1px solid rgba(255,255,255,.08);
        ">

          <span style="
            display:flex;
            align-items:center;
            gap:8px;
          ">

            ${
              x.photoUrl
                ? `
                  <img
                    src="${x.photoUrl}"
                    alt="${x.name}"
                    style="
                      width:44px;
                      height:44px;
                      border-radius:50%;
                      object-fit:cover;
                      flex-shrink:0;
                      border:2px solid #293452;
                    "
                  >
                `
                : `
                  <div style="
                    width:44px;
                    height:44px;
                    border-radius:50%;
                    background:#0d1528;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    flex-shrink:0;
                    font-size:20px;
                  ">
                    🏀
                  </div>
                `
            }

            <span>

              <b>${x.player.name}</b>

              ${captain}

              <small class="muted">
                ${x.player.position||""}
              </small>

              ${
                teamName
                  ? `
                    <small
                      class="muted"
                      style="margin-left:6px;"
                    >
                      ${teamName}
                    </small>
                  `
                  : ""
              }

            </span>

          </span>


          <span>
            ${scoreText}
          </span>

        </div>
      `;

    }


    let html="";


    if(starters.length){

      html+=`
        <div style="margin-top:10px;">

          <b>🏀 Titolari</b>

          ${starters
            .map(playerRow)
            .join("")}

        </div>
      `;

    }


    if(sixth.length){

      html+=`
        <div style="margin-top:12px;">

          <b>6️⃣ Sesto uomo</b>

          ${sixth
            .map(playerRow)
            .join("")}

        </div>
      `;

    }


    if(bench.length){

      html+=`
        <div style="margin-top:12px;">

          <b>🪑 Panchina</b>

          ${bench
            .map(playerRow)
            .join("")}

        </div>
      `;

    }


    if(out.length){

      html+=`
        <div style="margin-top:12px;">

          <b>❌ Fuori</b>

          ${out
            .map(playerRow)
            .join("")}

        </div>
      `;

    }


    return html;

  }


  /*
    Giorni disponibili.
  */

  let days={};

  matches.forEach(x=>{

    let day=
      Number(x.matchday_number);

    /*
      Nascondiamo completamente
      le giornate future.
    */

    if(
      currentDay!==null &&
      day>currentDay
    )
      return;


    if(!days[day])
      days[day]=[];

    days[day].push(x);

  });


  /*
    Giornata selezionata.

    Di default è quella attuale.

    Se l'utente ha scelto una giornata
    passata dal menu, usiamo quella.
  */

  let selectedDay=
    Number(
      window.calendarSelectedDay ||
      currentDay
    );


  /*
    Se per qualche motivo è stata selezionata
    una giornata futura, torniamo a quella attuale.
  */

  if(
    currentDay!==null &&
    selectedDay>currentDay
  ){

    selectedDay=currentDay;

  }


  /*
    Salviamo la scelta.
  */

  window.calendarSelectedDay=
    selectedDay;


  /*
    Giornate passate disponibili
    nel menu.
  */

  let archivedDays=
    allDays.filter(
      day=>day<currentDay
    );


  let html=`

    <div class="card">

      <h2>🏀 Calendario</h2>

      <p class="muted">
        Risultati e formazioni del campionato
      </p>


      <div style="
        margin-top:15px;
        max-width:300px;
      ">

        <label
          style="
            display:block;
            margin-bottom:6px;
            font-weight:600;
          "
        >
          Giornata
        </label>


        <select
          onchange="
            window.calendarSelectedDay=
              Number(this.value);
            calendar();
          "
          style="
            width:100%;
          "
        >

          ${
            currentDay!==null
              ? `
                <option
                  value="${currentDay}"
                  ${
                    selectedDay===currentDay
                      ? "selected"
                      : ""
                  }
                >
                  Giornata ${currentDay}
                </option>
              `
              : ""
          }


          ${
            archivedDays
              .slice()
              .sort((a,b)=>b-a)
              .map(day=>`

                <option
                  value="${day}"
                  ${
                    selectedDay===day
                      ? "selected"
                      : ""
                  }
                >
                  Giornata ${day}
                </option>

              `)
              .join("")
          }

        </select>

      </div>

    </div>

  `;


  /*
    Mostriamo SOLO la giornata selezionata.
  */

  if(days[selectedDay]){

    html+=`

      <div class="card">

        <h2>
          Giornata ${selectedDay}
        </h2>

        <table>

          <tr>
            <th>Casa</th>
            <th></th>
            <th>Trasferta</th>
          </tr>

    `;


    days[selectedDay].forEach(x=>{

      let homeManager=
        managers[x.home_manager_id];


      let awayManager=
        managers[x.away_manager_id];


      let homeName=
        homeManager?.team_name ||
        homeManager?.name ||
        "—";


      let awayName=
        awayManager?.team_name ||
        awayManager?.name ||
        "—";


      let homeManagerSmall=
        homeManager?.name || "";


      let awayManagerSmall=
        awayManager?.name || "";


      let score="";


      if(
        x.home_score!==null &&
        x.home_score!==undefined &&
        x.away_score!==null &&
        x.away_score!==undefined
      ){

        score=`
          <b>
            ${x.home_score}
            -
            ${x.away_score}
          </b>
        `;

      }


      /*
        Controlliamo la deadline.
      */

      let matchday=
        matchdays[selectedDay];


      let deadlinePassed=true;


      if(matchday?.lineup_deadline){

        deadlinePassed=
          new Date() >=
          new Date(
            matchday.lineup_deadline
          );

      }


      /*
        Formazioni già salvate.
      */

      let homeLineup=
        lineupMap[
          x.home_manager_id+
          "_"+
          matchday?.id
        ];


      let awayLineup=
        lineupMap[
          x.away_manager_id+
          "_"+
          matchday?.id
        ];


      let formationSection="";


      /*
        CONTENUTO FORMAZIONI
      */

      if(!deadlinePassed){

        formationSection=`

          <details>

            <summary style="
              cursor:pointer;
              padding:8px 0;
              font-weight:bold;
            ">
              👀 Vedi formazioni
            </summary>

            <div style="
              display:grid;
              grid-template-columns:1fr 1fr;
              gap:20px;
              margin-top:12px;
            ">

              <div>

                ${
                  homeLineup

                    ? `
                      <div
                        class="muted"
                        style="
                          padding:10px 0;
                          font-weight:600;
                        "
                      >
                        🔒 Formazione schierata, ma non visibile
                      </div>
                    `

                    : `
                      <div
                        class="muted"
                        style="
                          padding:10px 0;
                          font-weight:600;
                        "
                      >
                        ⏳ Formazione non ancora salvata
                      </div>
                    `
                }

              </div>


              <div>

                ${
                  awayLineup

                    ? `
                      <div
                        class="muted"
                        style="
                          padding:10px 0;
                          font-weight:600;
                        "
                      >

async function standings(){

  let r=await db
    .from("league_matches")
    .select(`
      *,
      home:home_manager_id(
        id,
        name,
        team_name
      ),
      away:away_manager_id(
        id,
        name,
        team_name
      )
    `);

  if(r.error)
    return message(
      r.error.message,
      "err"
    );

  let a={};

  (r.data||[]).forEach(x=>{

    if(!a[x.home_manager_id]){

      a[x.home_manager_id]={
        teamName:
          x.home?.team_name ||
          x.home?.name ||
          "—",

        managerName:
          x.home?.name ||
          "—",

        p:0
      };

    }

    if(!a[x.away_manager_id]){

      a[x.away_manager_id]={
        teamName:
          x.away?.team_name ||
          x.away?.name ||
          "—",

        managerName:
          x.away?.name ||
          "—",

        p:0
      };

    }

    a[x.home_manager_id].p+=
      Number(x.home_points||0);

    a[x.away_manager_id].p+=
      Number(x.away_points||0);

  });

  let rows=
    Object.values(a)
      .sort((x,y)=>y.p-x.p);

  el("content").innerHTML=`

    <div class="card">

      <h2>Classifica</h2>

      <table>

        <tr>
          <th>#</th>
          <th>Squadra</th>
          <th>Punti</th>
        </tr>

        ${rows.map((x,i)=>`

          <tr>

            <td>
              ${i+1}
            </td>

            <td>

              <b>
                ${x.teamName}
              </b>

              <br>

              <small class="muted">
                ${x.managerName}
              </small>

            </td>

            <td>
              <b>
                ${x.p}
              </b>
            </td>

          </tr>

        `).join("")}

      </table>

      <p class="muted">
        Spareggi: scontri diretti → punteggi nelle singole giornate → punteggi negli scontri diretti.
      </p>

    </div>

  `;

}

async function addCoachToManager(){

let manager=el("coachManager").value;
let team=el("coachTeam").value;
let price=Number(el("coachPrice").value);

if(!price || price<1)
return message("Inserisci un prezzo valido.","err");


let cm=await db.from("managers")
.select("credits")
.eq("id",manager)
.single();

if(cm.error)
return message(cm.error.message,"err");

let credits=Number(cm.data.credits);

if(price>credits)
return message("Crediti insufficienti.","err");


let existing=await db.from("manager_coaches")
.select("id")
.eq("manager_id",manager)
.eq("active",true)
.maybeSingle();

if(existing.error)
return message(existing.error.message,"err");

if(existing.data)
return message(
"Questo fantallenatore ha già un allenatore.",
"err"
);


let already=await db.from("manager_coaches")
.select("id")
.eq("real_team_id",team)
.eq("active",true)
.maybeSingle();

if(already.error)
return message(already.error.message,"err");

if(already.data)
return message(
"Questo allenatore è già stato acquistato da un altro fantallenatore.",
"err"
);


let x=await db.from("manager_coaches")
.insert({

manager_id:manager,
real_team_id:team,
purchase_price:price,
active:true

});

if(x.error)
return message(x.error.message,"err");


let u=await db.rpc("subtract_credits",{

manager_id_input:manager,
amount_input:price

});

if(u.error)
return message(
"Errore aggiornamento crediti: "+u.error.message,
"err"
);


message(
"Allenatore assegnato correttamente.",
"ok"
);

admin();

}
async function addPlayerToRoster(){
let manager=el("am").value;
let player=el("ap").value;
let price=Number(el("price").value);

if(!price||price<1)return message("Inserisci un prezzo valido.","err");

let cm=await db.from("managers")
.select("credits")
.eq("id",manager)
.single();

if(cm.error)return message(cm.error.message,"err");

let credits=Number(cm.data.credits);

if(price>credits)return message("Crediti insufficienti.","err");

let rosa=await db.from("rosters")
.select("player_id,players(position)")
.eq("manager_id",manager)
.eq("active",true);

if(rosa.error)return message(rosa.error.message,"err");

if((rosa.data||[]).length>=13)
return message("La rosa è già completa (13 giocatori).","err");

let already=await db.from("rosters")
.select("id")
.eq("player_id",player)
.eq("active",true)
.maybeSingle();

if(already.error)return message(already.error.message,"err");

if(already.data)
return message("Questo giocatore è già stato assegnato.","err");

let info=await db.from("players")
.select("position,is_foreign")
.eq("id",player)
.single();

if(info.error)return message(info.error.message,"err");

let ruolo=info.data.position;

let guardie=(rosa.data||[]).filter(x=>x.players?.position==="G").length;
let ali=(rosa.data||[]).filter(x=>x.players?.position==="A").length;
let centri=(rosa.data||[]).filter(x=>x.players?.position==="C").length;

if(ruolo==="G" && guardie>=5)
return message("Hai già 5 guardie.","err");

if(ruolo==="A" && ali>=5)
return message("Hai già 5 ali.","err");

if(ruolo==="C" && centri>=3)
return message("Hai già 3 centri.","err");

if(info.data.is_foreign){
let stranieri=await db.from("rosters")
.select("player_id,players(is_foreign)")
.eq("manager_id",manager)
.eq("active",true);

if((stranieri.data||[]).some(x=>x.players?.is_foreign))
return message("Hai già uno straniero in rosa.","err");
}

let x=await db.from("rosters").insert({
manager_id:manager,
player_id:player,
purchase_price:price,
active:true
});

if(x.error)return message(x.error.message,"err");

let u=await db.rpc("subtract_credits",{
manager_id_input:manager,
amount_input:price
});

if(u.error)return message("Errore aggiornamento crediti: "+u.error.message,"err");

message("Giocatore assegnato alla rosa.","ok");
admin();
}
async function removePlayerFromRoster(rosterId){
let r=await db.from("rosters")
.select("manager_id,purchase_price")
.eq("id",rosterId)
.single();

if(r.error)return message(r.error.message,"err");

let u=await db.rpc("add_credits",{
manager_id_input:r.data.manager_id,
amount_input:r.data.purchase_price
});

if(u.error)return message("Errore restituzione crediti: "+u.error.message,"err");

let x=await db.from("rosters")
.delete()
.eq("id",rosterId);

if(x.error)return message(x.error.message,"err");

message("Giocatore rimosso e crediti restituiti.","ok");
admin();
}
